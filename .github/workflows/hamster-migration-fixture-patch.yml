name: One-shot living material migration fixtures

on:
  push:
    branches:
      - agent/implement-hamsters-grubs-ecology
    paths:
      - .github/workflows/hamster-migration-fixture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-hamsters-grubs-ecology
      - name: Apply fixture patch
        run: python .github/scripts/hamster_migration_fixture_patch.py
      - name: Remove bootstrap files
        run: rm .github/scripts/hamster_migration_fixture_patch.py .github/workflows/hamster-migration-fixture-patch.yml
      - name: Commit fixture updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Dig.Tests .github
          git diff --cached --quiet || git commit -m "Update save migration fixtures for v11"
          git push origin HEAD:agent/implement-hamsters-grubs-ecology
