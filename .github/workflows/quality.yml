name: Quality

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-post-excavation-topology:
    if: github.head_ref == 'fix/post-excavation-topology-and-gravity-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-excavation-topology-and-gravity-v3
          fetch-depth: 0
      - name: Apply post-excavation topology patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/post-excavation-topology-gz-*.b64 \
            | base64 -d \
            | gzip -d > /tmp/post-excavation-topology.patch
          git apply --check /tmp/post-excavation-topology.patch
          git apply /tmp/post-excavation-topology.patch
          git rm .github/patches/post-excavation-topology-gz-*.b64
          git checkout origin/main -- .github/workflows/quality.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: synchronize post-excavation topology"
          git push origin HEAD:fix/post-excavation-topology-and-gravity-v3
