name: Quality

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-runtime-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-selection-excavation-item-placement
          fetch-depth: 0
          show-progress: false

      - name: Recover staged runtime files
        shell: bash
        run: |
          set -euo pipefail
          cat .dig-runtime-patch/part-* | tr -d '\r\n\t ' > /tmp/runtime-selected.tar.gz.b64
          base64 --decode /tmp/runtime-selected.tar.gz.b64 > /tmp/runtime-selected.tar.gz 2>/tmp/base64-error.txt || true
          mkdir -p /tmp/runtime-selected
          tar -xzf /tmp/runtime-selected.tar.gz -C /tmp/runtime-selected --ignore-zeros 2>/tmp/tar-error.txt || true
          test -f /tmp/runtime-selected/src/Dig.Domain/World/ExcavationWorkCoordinator.cs
          test -f /tmp/runtime-selected/unity/Dig.Unity/Assets/Dig.Unity/Runtime/DigExcavationQuarterMarker.cs
          rsync -a --exclude 'DigWorldInteraction.BuildingBoxes.cs' /tmp/runtime-selected/ ./
          rm -rf .dig-runtime-patch
          git checkout origin/main -- .github/workflows/quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover runtime selection, excavation and item placement changes"
          git push origin HEAD:fix/runtime-selection-excavation-item-placement
