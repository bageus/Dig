name: Quality

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-excavation-frontier-rebase:
    if: github.head_ref == 'fix/excavation-frontier-entry-and-near-quarter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/excavation-frontier-entry-and-near-quarter
          fetch-depth: 0
      - name: Apply rebased excavation frontier patch
        id: apply
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/excavation-frontier-rebase-diagnostics.txt) 2>&1
          set -x
          cat .github/patches/excavation-frontier-rebase-*.b64 > /tmp/excavation-frontier-rebase.b64
          wc -c /tmp/excavation-frontier-rebase.b64
          sha256sum /tmp/excavation-frontier-rebase.b64
          base64 -d /tmp/excavation-frontier-rebase.b64 > /tmp/excavation-frontier-rebase.patch.gz
          decode_status=$?
          wc -c /tmp/excavation-frontier-rebase.patch.gz
          sha256sum /tmp/excavation-frontier-rebase.patch.gz
          gzip -t /tmp/excavation-frontier-rebase.patch.gz
          gzip_status=$?
          gzip -dc /tmp/excavation-frontier-rebase.patch.gz > /tmp/excavation-frontier-rebase.patch
          inflate_status=$?
          wc -c /tmp/excavation-frontier-rebase.patch
          sha256sum /tmp/excavation-frontier-rebase.patch
          git apply --check --verbose /tmp/excavation-frontier-rebase.patch
          check_status=$?
          if [ "$decode_status" -ne 0 ] || [ "$gzip_status" -ne 0 ] || [ "$inflate_status" -ne 0 ] || [ "$check_status" -ne 0 ]; then
            exit 1
          fi
          set -euo pipefail
          git apply /tmp/excavation-frontier-rebase.patch
          python tools/quality/check_quality.py
          python tools/quality/check_unity_source_contracts.py
          git diff --check
          git rm .github/workflows/apply-excavation-frontier-rebase.yml
          git rm .github/patches/excavation-frontier-rebase-*.b64
          git rm .github/patches/excavation-frontier-rebase.ready
          git checkout origin/main -- .github/workflows/quality.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore excavation frontier entry and gravity"
          git push origin HEAD:fix/excavation-frontier-entry-and-near-quarter
      - name: Upload excavation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excavation-frontier-rebase-diagnostics
          path: |
            /tmp/excavation-frontier-rebase-diagnostics.txt
            /tmp/excavation-frontier-rebase.b64
            /tmp/excavation-frontier-rebase.patch.gz
            /tmp/excavation-frontier-rebase.patch
          if-no-files-found: warn
          retention-days: 2
