name: Quality

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run architecture, file-size and C# compatibility checks
        run: python tools/quality/check_quality.py

      - name: Validate quality workflow gates
        run: python tools/quality/check_quality_workflow_contracts.py

      - name: Validate Unity built-in modules
        run: python tools/quality/check_unity_modules.py

      - name: Validate Unity source contracts
        shell: bash
        run: |
          set -o pipefail
          python tools/quality/check_unity_source_contracts.py 2>&1 | tee unity-source-contracts.log

      - name: Validate Unity runtime evidence tooling
        run: python tools/quality/validate_unity_runtime_evidence.py --self-test

      - name: Validate Unity native field initialization
        run: python tools/quality/check_unity_native_field_initializers.py

      - name: Validate chunked terrain interaction boundary
        run: python tools/quality/check_unity_terrain_chunk_contracts.py

      - name: Validate terrain visual profiles
        run: python tools/quality/check_unity_terrain_visual_profiles.py

      - name: Validate terrain deposit presentation
        run: python tools/quality/check_unity_terrain_deposit_contracts.py

      - name: Validate cave template trim presentation
        run: python tools/quality/check_unity_cave_template_trim_contracts.py

      - name: Validate terrain accessibility and LOD
        run: python tools/quality/check_unity_terrain_accessibility_lod_contracts.py

      - name: Validate building prefab presentation
        run: python tools/quality/check_unity_building_visual_contracts.py

      - name: Validate item prefab and bounded stack presentation
        run: python tools/quality/check_unity_item_visual_contracts.py

      - name: Validate unified overlay presentation
        run: python tools/quality/check_unity_overlay_contracts.py

      - name: Validate resident rig presentation
        run: python tools/quality/check_unity_resident_visual_contracts.py

      - name: Validate excavation Play Mode verification contracts
        run: python tools/quality/check_unity_excavation_playmode_contracts.py

      - name: Validate creature visual presentation
        run: python tools/quality/check_unity_creature_visual_contracts.py

      - name: Validate stylized rendering and VFX
        run: python tools/quality/check_unity_stylized_render_vfx_contracts.py

      - name: Validate URP completion contracts
        run: python tools/quality/check_unity_urp_completion_contracts.py

      - name: Validate presentation effect projection
        run: python tools/quality/check_unity_presentation_effect_projection_contracts.py

      - name: Validate adaptive HUD startup
        run: python tools/quality/check_unity_hud_startup_contracts.py

      - name: Validate skills progression integration
        run: python tools/quality/check_unity_skills_progression_contracts.py

      - name: Upload Unity source contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-source-contracts-log
          path: unity-source-contracts.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Dig.sln

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build Dig.sln --configuration Release --no-restore 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Dig.sln --configuration Release --no-build --verbosity normal 2>&1 | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run headless smoke test
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/Dig.Headless/Dig.Headless.csproj --configuration Release --no-build 2>&1 | tee headless-smoke.log

      - name: Run standard deterministic soak
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/Dig.Headless/Dig.Headless.csproj \
            --configuration Release --no-build -- \
            --soak --profile standard \
            --report soak-report-standard.json 2>&1 | tee soak-standard.log

      - name: Run large settlement deterministic soak
        if: always()
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/Dig.Headless/Dig.Headless.csproj \
            --configuration Release --no-build -- \
            --soak --profile large \
            --report soak-report-large.json 2>&1 | tee soak-large.log

      - name: Upload headless smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-log
          path: headless-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload standard soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-standard
          path: |
            soak-report-standard.json
            soak-standard.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload large soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-large
          path: |
            soak-report-large.json
            soak-large.log
          if-no-files-found: warn
          retention-days: 14

  sync-needs-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/free-time-needs-actions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/free-time-needs-actions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update system index and restore workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/systems/README.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '| Agent state, needs и Utility AI | dwarf AI, schedule, player override | `IMPLEMENTED` | [`../architecture/systems-core.md`](../architecture/systems-core.md#4-жители), [`../design/needs-continuous-actions.md`](../design/needs-continuous-actions.md) | [`../implementation/agents-utility-ai.md`](../implementation/agents-utility-ai.md), [#5](https://github.com/bageus/Dig/issues/5) |':
              '| Agent state, needs и Utility AI | dwarf AI, schedule, free time, hunger, sleep, mood, player override | `IMPLEMENTED` | [`../architecture/systems-core.md`](../architecture/systems-core.md#4-жители), [`../design/needs-continuous-actions.md`](../design/needs-continuous-actions.md), [`../design/resident-schedule-needs-actions.md`](../design/resident-schedule-needs-actions.md) | [`../implementation/agents-utility-ai.md`](../implementation/agents-utility-ai.md), [`../implementation/resident-free-time-needs-actions-2026-08-02.md`](../implementation/resident-free-time-needs-actions-2026-08-02.md), [#159](https://github.com/bageus/Dig/issues/159), [#113](https://github.com/bageus/Dig/issues/113), [#569](https://github.com/bageus/Dig/pull/569) |',
              '| Sleep и beds | comfort, personal bed | `APPROVED` | [`../design/sleep-comfort-and-bed-assignment.md`](../design/sleep-comfort-and-bed-assignment.md) | [#40](https://github.com/bageus/Dig/issues/40) |':
              '| Sleep и beds | comfort, personal bed, floor sleep, fallback | `IMPLEMENTED` | [`../design/sleep-comfort-and-bed-assignment.md`](../design/sleep-comfort-and-bed-assignment.md), [`../design/resident-schedule-needs-actions.md`](../design/resident-schedule-needs-actions.md) | [`../implementation/resident-free-time-needs-actions-2026-08-02.md`](../implementation/resident-free-time-needs-actions-2026-08-02.md), [#142](https://github.com/bageus/Dig/issues/142), [#569](https://github.com/bageus/Dig/pull/569) |',
              '| Notifications | ticker, attack, hunger, completion | `APPROVED` | [`../design/resident-hud-selection-and-notifications.md`](../design/resident-hud-selection-and-notifications.md) | [`../implementation/unity-notification-ticker.md`](../implementation/unity-notification-ticker.md), [#113](https://github.com/bageus/Dig/issues/113) |':
              '| Notifications | ticker, attack, hunger, work-time hunger, completion | `APPROVED` | [`../design/resident-hud-selection-and-notifications.md`](../design/resident-hud-selection-and-notifications.md), [`../design/resident-schedule-needs-actions.md`](../design/resident-schedule-needs-actions.md) | [`../implementation/unity-notification-ticker.md`](../implementation/unity-notification-ticker.md), [`../implementation/resident-free-time-needs-actions-2026-08-02.md`](../implementation/resident-free-time-needs-actions-2026-08-02.md), [#113](https://github.com/bageus/Dig/issues/113), [#569](https://github.com/bageus/Dig/pull/569) |',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing system index row: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/systems/README.md .github/workflows/quality.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Index resident free-time needs actions"
          git push origin feature/free-time-needs-actions
