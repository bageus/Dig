name: Apply issue 87 patch

on:
  push:
    branches:
      - agent/issue-87-resource-excavation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          cat .agent/issue87.patch.gz.* > /tmp/issue87.patch.gz
          gzip -dc /tmp/issue87.patch.gz > /tmp/issue87.patch
          git apply --index --whitespace=nowarn /tmp/issue87.patch
          rm -rf .agent
          rm .github/workflows/apply-issue87-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete issue 87 resource excavation scope"
          git push origin "HEAD:${GITHUB_REF_NAME}"
