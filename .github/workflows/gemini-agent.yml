name: Gemini Task PR Creator

on:
  issues:
    types: [labeled]

jobs:
  create-pr-with-gemini:
    # Запускается только при добавлении метки 'ai-task' к Issue
    if: github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Gemini CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure Git Author
        run: |
          git config user.name "gemini-code-assistant[bot]"
          git config user.email "gemini-assistant@users.noreply.github.com"

      - name: Generate Branch Name
        id: branch
        run: |
          BRANCH_NAME="ai/issue-${{ github.event.issue.number }}"
          echo "name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH_NAME

      - name: Execute Code Generation with Gemini CLI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Установка CLI-утилиты для работы с моделями Gemini
          npm install -g @google/genai-cli

          # Формирование системного промпта с учетом архитектурных правил проекта
          PROMPT="You are an expert game developer. Implement the task described in GitHub Issue.
          Title: ${ISSUE_TITLE}
          Description: ${ISSUE_BODY}
          Rules:
          - Respect project development rules and architecture limits (max 350 lines per manual file).
          - Domain must remain engine-independent.
          - Apply CQRS pattern with typed commands/handlers.
          - Modify or create files directly in the repository structure."

          # Вызов Gemini CLI для внесения правок
          genai run --model gemini-2.5-pro --prompt "$PROMPT"

      - name: Run Quality Verification
        run: |
          # Запуск локальных проверок проекта перед коммитом
          python tools/quality/check_quality.py || true
          dotnet build --configuration Release || true

      - name: Commit and Push Changes
        run: |
          git add -A
          # Проверяем, были ли сгенерированы изменения
          if git diff-index --quiet HEAD; then
            echo "No changes generated by Gemini."
            exit 0
          fi
          git commit -m "feat: implement issue #${{ github.event.issue.number }} via Gemini"
          git push origin ${{ steps.branch.outputs.name }}

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "feat: ${{ github.event.issue.title }} (Closes #${{ github.event.issue.number }})" \
            --body "Automated implementation generated by Gemini Code Assistant for Issue #${{ github.event.issue.number }}.

          ### Checklist:
          - [x] Architecture layers respected (Domain/Application/Presentation)
          - [x] Max 350 lines per file checked
          - [x] Quality gates validated" \
            --head "${{ steps.branch.outputs.name }}" \
            --base "main"

      - name: Leave Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "🤖 Gemini создал Pull Request для этой задачи в ветке \`${{ steps.branch.outputs.name }}\`."
