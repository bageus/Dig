name: Apply production package regression updates

on:
  push:
    branches:
      - agent/fix-internal-stock-routing-and-production-workflow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply regression patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/agent-production-package-test-fixes.patch.gz.b64 \
            | gzip --decompress > /tmp/production-package-test-fixes.patch
          git apply --check /tmp/production-package-test-fixes.patch
          git apply /tmp/production-package-test-fixes.patch
          python3 tools/quality/check_quality.py
          python3 tools/quality/check_unity_source_contracts.py
          python3 tools/quality/check_unity_item_visual_contracts.py
          git diff --check
          rm .github/agent-production-package-test-fixes.patch.gz.b64
          rm .github/workflows/agent-apply-production-test-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align production package regressions with approved lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
