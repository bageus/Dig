name: Apply mushroom upright docs

on:
  push:
    branches:
      - fix/mushroom-upright-material-targeting

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/agent/mushroom-upright-docs.patch.gz.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/mushroom-upright-material-targeting
          fetch-depth: 0

      - name: Apply authoritative docs
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/agent/mushroom-upright-docs.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/mushroom-upright-docs.patch
          git apply --check /tmp/mushroom-upright-docs.patch
          git apply --index /tmp/mushroom-upright-docs.patch
          rm -f \
            .github/agent/mushroom-upright-docs.patch.gz.b64 \
            .github/workflows/apply-mushroom-upright-docs.yml
          rmdir .github/agent 2>/dev/null || true
          git add -A
          git diff --cached --check

      - name: Commit authoritative docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git commit -m "docs: clarify mushroom drops and world orientation"
          git push origin HEAD:fix/mushroom-upright-material-targeting
