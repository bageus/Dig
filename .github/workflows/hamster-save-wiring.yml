name: One-shot living material save wiring

on:
  push:
    branches:
      - agent/implement-hamsters-grubs-ecology
    paths:
      - .github/workflows/hamster-save-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-hamsters-grubs-ecology
      - name: Apply save wiring
        run: python .github/scripts/hamster_save_wiring.py
      - name: Remove bootstrap files
        run: rm .github/scripts/hamster_save_wiring.py .github/workflows/hamster-save-wiring.yml
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Dig.Application/Saving src/Dig.Infrastructure/Saving .github
          git diff --cached --quiet || git commit -m "Wire living material save format"
          git push origin HEAD:agent/implement-hamsters-grubs-ecology
