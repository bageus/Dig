name: Apply Excavation Topology Work Stance

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-excavation-topology-work-stance:
    if: github.head_ref == 'fix/excavation-topology-work-stance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/excavation-topology-work-stance
          fetch-depth: 0
      - name: Apply excavation topology patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/excavation-topology-work-stance.b64 \
            | gzip -d > /tmp/excavation-topology-work-stance.patch
          echo "412b18905fd91c910a1cd095ae3d3806d458dbab6a6343ef04854353634243be  /tmp/excavation-topology-work-stance.patch" | sha256sum -c -
          git apply --check /tmp/excavation-topology-work-stance.patch
          git apply /tmp/excavation-topology-work-stance.patch
          python tools/quality/check_quality.py
          python tools/quality/check_unity_source_contracts.py
          git diff --check
          git rm .github/patches/excavation-topology-work-stance.b64
          git rm .github/workflows/apply-excavation-topology-work-stance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore excavation topology and shaft work stance"
          git push origin HEAD:fix/excavation-topology-work-stance
