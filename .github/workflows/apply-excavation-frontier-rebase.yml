name: Apply rebased excavation frontier fix

on:
  push:
    branches:
      - fix/excavation-frontier-entry-and-near-quarter
    paths:
      - .github/patches/excavation-frontier-rebase.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/excavation-frontier-entry-and-near-quarter
          fetch-depth: 0
      - name: Apply validated rebased excavation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/excavation-frontier-rebase-*.b64 \
            | base64 -d \
            | gzip -d > /tmp/excavation-frontier-rebase.patch
          echo "ec0e72debe7e643813f37c155589511c1276828784079a1e290afe15eb01ec45  /tmp/excavation-frontier-rebase.patch" | sha256sum -c -
          git apply --check /tmp/excavation-frontier-rebase.patch
          git apply /tmp/excavation-frontier-rebase.patch
          python tools/quality/check_quality.py
          python tools/quality/check_unity_source_contracts.py
          git diff --check
          git rm .github/workflows/apply-excavation-frontier-rebase.yml
          git rm .github/patches/excavation-frontier-rebase-*.b64
          git rm .github/patches/excavation-frontier-rebase.ready
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore excavation frontier entry and gravity"
          git push origin HEAD:fix/excavation-frontier-entry-and-near-quarter
