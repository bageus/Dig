name: Align headless building side cell

on:
  push:
    branches:
      - agent/fix-hud-basket-placement-building-work-position

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-hud-basket-placement-building-work-position
          fetch-depth: 0
      - name: Open and use a supported side work cell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scenario = Path('src/Dig.Headless/HeadlessBuildingScenario.cs')
          text = scenario.read_text(encoding='utf-8')
          text = text.replace(
              '        EntityId buildingId = Require(state.Entities.RegisterNew());\n        BuildingDefinition definition = new BuildingDefinition(',
              '        EntityId buildingId = Require(state.Entities.RegisterNew());\n        CellId workPosition = new CellId(origin.X - 1, origin.Y, origin.Z);\n        BuildingDefinition definition = new BuildingDefinition(',
              1)
          text = text.replace(
              '            new[] { new CellOffset(0, 0) },\n            new[] { new BuildingMaterialRequirement(materialId, 1) },',
              '            new[] { new CellOffset(-1, 0), new CellOffset(1, 0) },\n            new[] { new BuildingMaterialRequirement(materialId, 1) },',
              1)
          text = text.replace('            new[] { origin },\n            startTick)));', '            new[] { workPosition },\n            startTick)));', 1)
          text = text.replace('            new[] { origin },\n            priority: 700,', '            new[] { workPosition },\n            priority: 700,', 1)
          scenario.write_text(text, encoding='utf-8')

          program = Path('src/Dig.Headless/Program.cs')
          text = program.read_text(encoding='utf-8')
          marker = '''        Require(advanceJob.Handle(new AdvanceJobCommand(digJobId, tick: 23)));

        CellSnapshot cell = Require(new QueryPipeline().Execute(
'''
          replacement = '''        Require(advanceJob.Handle(new AdvanceJobCommand(digJobId, tick: 23)));
        CellId buildingWorkPosition = new CellId(target.X - 1, target.Y, target.Z);
        Require(commands.Execute(
            new ExcavateCellCommand(buildingWorkPosition, air, tick: 23),
            new ExcavateCellCommandHandler(worldRepository, journal),
            tick: 23));

        CellSnapshot cell = Require(new QueryPipeline().Execute(
'''
          if marker not in text:
              raise SystemExit('headless excavation marker not found')
          program.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          git rm .github/workflows/align-headless-building-side-cell.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Dig.Headless
          git commit -m "Align headless construction with side work position"
          git push origin HEAD:agent/fix-hud-basket-placement-building-work-position
