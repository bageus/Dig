name: Materialize Direct Excavation Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-direct-excavation-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout direct excavation branch
        uses: actions/checkout@v4
        with:
          ref: fix/direct-excavation-ordinary-jobs
          fetch-depth: 0
          show-progress: false

      - name: Apply validated runtime patch
        shell: bash
        run: |
          set -euo pipefail
          cat .direct-excavation-patch/part-* | tr -d '\r\n\t ' | base64 --decode | gzip -dc > /tmp/direct-excavation.patch
          git apply --check /tmp/direct-excavation.patch
          git apply /tmp/direct-excavation.patch
          rm -rf .direct-excavation-patch
          rm -f .github/workflows/materialize-direct-excavation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix direct excavation ordinary job assignment"
          git push origin HEAD:fix/direct-excavation-ordinary-jobs
