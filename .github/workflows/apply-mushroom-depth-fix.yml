name: Apply mushroom depth fix

on:
  pull_request:
    branches:
      - automation/mushroom-depth-apply-base

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/mushroom-z-depth-slab
          fetch-depth: 0

      - name: Fetch reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/mushroom-depth-apply-trigger
          git show origin/automation/mushroom-depth-apply-trigger:.github/agent/mushroom-depth-docs.patch.gz.b64 > /tmp/docs.b64
          git show origin/automation/mushroom-depth-apply-trigger:.github/agent/mushroom-depth-code.patch.gz.b64 > /tmp/code.b64
          base64 --decode /tmp/docs.b64 | gzip --decompress > /tmp/docs.patch
          base64 --decode /tmp/code.b64 | gzip --decompress > /tmp/code.patch
          echo "f210f3391ed36634c133578d57324bbce9769c265dfc4fa48918b9ae12d764d7  /tmp/docs.patch" | sha256sum --check
          echo "58436b3b8a2577bd61206deb964a98f69fa800b4471c4e75ae2018ee24e06012  /tmp/code.patch" | sha256sum --check

      - name: Commit authoritative design first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git apply --check /tmp/docs.patch
          git apply --index /tmp/docs.patch
          git diff --cached --check
          git commit -m "docs: constrain mushrooms to authoritative Z slabs"

      - name: Commit runtime fix and regressions
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/code.patch
          git apply --index /tmp/code.patch
          git diff --cached --check
          git commit -m "Fix mushroom Z depth projection"
          git push origin HEAD:fix/mushroom-z-depth-slab
