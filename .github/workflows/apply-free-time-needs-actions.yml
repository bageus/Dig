          note = Path('docs/implementation/resident-free-time-needs-actions-2026-08-02.md')
          note.write_text('''# Resident free-time needs actions — 2026-08-02

## Status

`IMPLEMENTED` in feature branch; runtime remains unverified until licensed Unity Play Mode executes the checked-in scenario.

## Tracking

- needs intervals and schedule gate: #159;
- sleep facility/Floor fallback: #142;
- hunger notification and HUD: #113.

## Implementation

- Utility AI exposes automatic Eat only outside Work schedule; an existing/manual Eat can continue.
- Settlement Sleep always has a valid target: available Bed first, otherwise reservation-free FloorSleep.
- Targeted Eat/Sleep/Leisure apply deterministic proportional intervals and completion does not apply the full effect again.
- Floor Sleep suppresses positive Mood and caps Alertness at 7500.
- Idle no longer grants positive Alertness, Mood or Health.
- Existing need-threshold events remain the notification source; no Presentation command is created.

## Verification boundary

Domain/Application tests cover schedule gating, work-time hunger events, free-time food acquisition, bed preference, Floor fallback/caps and progressive effects. A Unity Play Mode regression is checked in, but the feature is not `VERIFIED` until that test actually executes on a licensed runner.
''', encoding='utf-8')
