name: Apply Free-Time Needs Actions

on:
  push:
    branches:
      - feature/free-time-needs-actions
    paths:
      - .github/workflows/apply-free-time-needs-actions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/free-time-needs-actions
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update authoritative documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def append_once(path, heading, text):
              p = Path(path)
              content = p.read_text(encoding='utf-8')
              if heading not in content:
                  content = content.rstrip() + '\n\n' + text.strip() + '\n'
                  p.write_text(content, encoding='utf-8')

          append_once(
              'docs/design/needs-continuous-actions.md',
              '## Schedule-gated needs behavior (confirmed 2026-08-02)',
              '''
          ## Schedule-gated needs behavior (confirmed 2026-08-02)

          - Automatic `Eat` is eligible only when the resident is outside `ScheduleActivity.Work`.
          - A resident who becomes hungry during working time keeps Work or the active direct player order; hunger does not reserve or consume food automatically.
          - Working-time hunger still raises the authoritative threshold-crossing event and notification.
          - A direct food command is allowed during working time. It owns the existing bite-based `Eat` action, and an already active direct meal is allowed to continue.
          - Nutrition, Alertness and Mood improvements are committed only by real action intervals: confirmed food bites/targeted Eat, active Sleep, and active Leisure respectively.
          - Idle does not restore Alertness, Mood or Health by itself.
          - Targeted Eat, Sleep and Leisure distribute their data-driven action effect across deterministic intervals. Interruption keeps completed intervals; completion applies no duplicate bonus.
          - The active action's elapsed interval is the replay/save boundary: after restore the next unapplied interval is used.

          ### Acceptance

          - Work-schedule critical hunger leaves automatic Eat unavailable while direct feeding remains valid.
          - Free-time hunger can acquire one food reservation and perform Eat.
          - Hunger notification is emitted during work without automatic consumption.
          - Partial Sleep/Leisure/Eat produces partial authoritative need changes.
          - Completion, interruption and replay do not duplicate an interval.
          ''' )

          append_once(
              'docs/design/sleep-comfort-and-bed-assignment.md',
              '## Runtime bed-first fallback (confirmed 2026-08-02)',
              '''
          ## Runtime bed-first fallback (confirmed 2026-08-02)

          Sleep target resolution is ordered and deterministic:

          1. reserve an available `Bed` facility first;
          2. if no bed is available, create a reservation-free `FloorSleep` target for the resident;
          3. never report `bed_unavailable` while the resident can sleep on the ground;
          4. Floor applies the approved tier limits: no positive Mood effect and Alertness cannot rise above `7500`;
          5. a bed reservation is released once on completion/interruption, while Floor owns no building reservation.

          Regression coverage must include one bed with two tired residents: the first uses the bed and the second sleeps on the floor without double reservation.
          ''' )

          append_once(
              'docs/design/content/food.md',
              '## Work-schedule automatic eating gate (confirmed 2026-08-02)',
              '''
          ## Work-schedule automatic eating gate (confirmed 2026-08-02)

          Automatic food seeking is disabled during `ScheduleActivity.Work`, including critical hunger. The resident remains available for Work and direct player orders. Manual/direct feeding remains valid and executes the same authoritative bite-based meal workflow; the HUD hunger notification never creates an Eat command by itself.
          ''' )

          append_once(
              'docs/design/resident-hud-selection-and-notifications.md',
              '## Hunger notification and work schedule (confirmed 2026-08-02)',
              '''
          ## Hunger notification and work schedule (confirmed 2026-08-02)

          The existing `Nutrition < 1500` downward crossing is emitted during working time as well. The projected notification is informational/navigation UI only: it does not reserve food, start Eat or interrupt Work. The player can explicitly feed the resident through the existing direct food interaction. Recovery followed by a new downward crossing may notify again; duplicate source events remain suppressed.
          ''' )

