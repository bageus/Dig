name: Publish automatic world item grounding

on:
  push:
    branches:
      - agent/automatic-world-item-grounding
    paths:
      - .agent/automatic-grounding.part.*
      - .github/workflows/publish-automatic-world-item-grounding.yml

permissions:
  contents: write

concurrency:
  group: publish-automatic-world-item-grounding
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/automatic-world-item-grounding
          fetch-depth: 0

      - name: Apply feature payload
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/automatic-grounding.part.* | base64 --decode > /tmp/grounding.tar.gz
          echo "776202ce42a0184d9170a815be2d5543b2be53a5dfee3b84c5cf3b65f69e4826  /tmp/grounding.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grounding.tar.gz -C .
          rm -f .agent/automatic-grounding.part.*
          rmdir .agent 2>/dev/null || true

      - name: Commit published feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No feature changes to publish."
            exit 0
          fi
          git commit -m "Implement automatic world item grounding"
          git push origin HEAD:agent/automatic-world-item-grounding
