name: Apply rebased issues 92 and 109 implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issues-92-109-terrain-output' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-92-109-terrain-output
          fetch-depth: 0
      - name: Verify and apply prepared implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/issues-92-109-rebased.patch.part.* > /tmp/issues-92-109.patch
          test "$(wc -c < /tmp/issues-92-109.patch)" = "182091"
          echo "1f421e89d1cfa1ff0cac580b53bc55fd4613cd97e86f87499c7b262c13cbc044  /tmp/issues-92-109.patch" | sha256sum --check
          git apply --check /tmp/issues-92-109.patch
          git apply --index /tmp/issues-92-109.patch
          git rm .agent/issues-92-109-rebased.patch.part.*
          git rm .github/workflows/apply-issues-92-109-rebased.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete terrain output profiles and atomic mining output"
          git push origin HEAD:agent/issues-92-109-terrain-output
