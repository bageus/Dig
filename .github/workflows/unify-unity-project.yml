name: Unify Unity Project

on:
  push:
    branches:
      - chore/unify-unity-project

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate Unity project at repository root
        shell: bash
        run: |
          set -euo pipefail

          test -d unity/Dig.Unity/Assets
          test -d unity/Dig.Unity/Packages
          test -d unity/Dig.Unity/ProjectSettings
          test -d Assets/DigDwarfs

          preserve="$(mktemp -d)"
          cp -a Assets/DigDwarfs "${preserve}/DigDwarfs"
          if [[ -f Assets/DigDwarfs.meta ]]; then
            cp -a Assets/DigDwarfs.meta "${preserve}/DigDwarfs.meta"
          fi

          git rm -r --ignore-unmatch Assets Packages ProjectSettings Library Logs Temp UserSettings
          mv unity/Dig.Unity/Assets Assets
          mv unity/Dig.Unity/Packages Packages
          mv unity/Dig.Unity/ProjectSettings ProjectSettings
          cp -a "${preserve}/DigDwarfs" Assets/DigDwarfs
          if [[ -f "${preserve}/DigDwarfs.meta" ]]; then
            cp -a "${preserve}/DigDwarfs.meta" Assets/DigDwarfs.meta
          fi
          rm -rf unity

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          text_suffixes = {
              '.cs', '.csproj', '.json', '.md', '.py', '.sh', '.txt', '.yml', '.yaml',
              '.props', '.targets', '.rsp', '.asmdef', '.asset', '.meta', '.unity', '.sln'
          }
          explicit_names = {'.gitignore', '.editorconfig'}

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in explicit_names:
                  continue
              try:
                  text = path.read_text(encoding='utf-8-sig')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              text = text.replace('file:../../../src', 'file:../src')
              text = text.replace('unity/Dig.Unity/', '')
              text = text.replace('unity/Dig.Unity', '.')
              text = re.sub(
                  r'ROOT\s*(?:\n\s*)?/\s*"unity"\s*(?:\n\s*)?/\s*"Dig\.Unity"',
                  'ROOT',
                  text,
              )
              text = text.replace('UNITY_CSHARP_ROOTS = ("src", "tests", "unity")',
                                  'UNITY_CSHARP_ROOTS = ("src", "tests", "Assets")')
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/unity-playmode.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('      - "unity/**"\n',
                              '      - "Assets/**"\n      - "Packages/**"\n      - "ProjectSettings/**"\n')
          text = text.replace('          path: Library', '          path: Library')
          text = text.replace("hashFiles('Packages/**', 'ProjectSettings/ProjectVersion.txt')",
                              "hashFiles('Packages/**', 'ProjectSettings/ProjectVersion.txt')")
          text = text.replace('          projectPath: .', '          projectPath: .')
          workflow.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('unity/\n  Dig.Unity/                     Unity 6 presentation host and editor tooling\n',
                              'Assets/                            Unity 6 presentation assets and editor tooling\nPackages/                          Unity Package Manager configuration\nProjectSettings/                   Unity project settings\n')
          text = text.replace('Select `.`, not the repository root.', 'Select the repository root.')
          text = text.replace('remove the generated `./Library` directory', 'remove the generated `Library` directory')
          readme.write_text(text, encoding='utf-8')

          doc = Path('docs/implementation/unity-presentation-host.md')
          if doc.exists():
              text = doc.read_text(encoding='utf-8')
              text = text.replace('Select `<repository>/.`, not the repository root.', 'Select the repository root.')
              text = text.replace('`./Packages/manifest.json`', '`Packages/manifest.json`')
              text = text.replace('under `./Assets/Dig.Unity`', 'under `Assets/Dig.Unity`')
              doc.write_text(text, encoding='utf-8')
          PY

          cat > tools/quality/check_single_unity_project.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys

          ROOT = Path(__file__).resolve().parents[2]
          REQUIRED = ('Assets', 'Packages', 'ProjectSettings')

          errors = []
          for name in REQUIRED:
              if not (ROOT / name).is_dir():
                  errors.append(f'root Unity project is missing {name}/')

          project_version = ROOT / 'ProjectSettings' / 'ProjectVersion.txt'
          if not project_version.is_file():
              errors.append('root Unity project is missing ProjectSettings/ProjectVersion.txt')

          nested = []
          for version_file in ROOT.rglob('ProjectSettings/ProjectVersion.txt'):
              project_root = version_file.parent.parent
              if project_root == ROOT:
                  continue
              if (project_root / 'Assets').is_dir() and (project_root / 'Packages').is_dir():
                  nested.append(project_root.relative_to(ROOT))
          if nested:
              errors.append('secondary Unity project(s) detected: ' + ', '.join(map(str, sorted(nested))))

          legacy = ROOT / 'unity' / 'Dig.Unity'
          if legacy.exists():
              errors.append('legacy unity/Dig.Unity project must not exist')

          if errors:
              print('Unity project layout check failed:', file=sys.stderr)
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)

          print('PASS: repository root is the only Unity project')
          PY
          chmod +x tools/quality/check_single_unity_project.py

          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/quality.yml')
          text = p.read_text(encoding='utf-8')
          anchor = '      - name: Run architecture, file-size and C# compatibility checks\n        run: python tools/quality/check_quality.py\n'
          insertion = anchor + '\n      - name: Validate single root Unity project layout\n        run: python tools/quality/check_single_unity_project.py\n'
          if 'check_single_unity_project.py' not in text:
              if anchor not in text:
                  raise SystemExit('quality workflow insertion anchor not found')
              text = text.replace(anchor, insertion)
          p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/unify-unity-project.yml
          git add -A

          if git grep -n 'file:../../../src' -- . ':!docs/implementation/unity-presentation-host.md'; then
            echo 'Old UPM path remains' >&2
            exit 1
          fi
          if git grep -n 'unity/Dig.Unity' -- .; then
            echo 'Old nested Unity path remains' >&2
            exit 1
          fi
          test ! -e Assets/Scenes/SampleScene.unity
          test -e Assets/Scenes/Main.unity
          test -d Assets/DigDwarfs
          test ! -e unity/Dig.Unity
          grep -q '"com.bageus.dig.core": "file:../src"' Packages/manifest.json
          grep -q '"version": "file:../src"' Packages/packages-lock.json

          python tools/quality/check_single_unity_project.py
          python -m py_compile tools/quality/*.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: unify Unity project at repository root'
          git push origin HEAD:chore/unify-unity-project
