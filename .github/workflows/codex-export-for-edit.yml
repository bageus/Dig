name: Codex export repository for edit

on:
  push:
    branches:
      - codex/forced-orders-room-upgrade

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -qr "$RUNNER_TEMP/dig-source.zip" . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: dig-source-for-edit
          path: ${{ runner.temp }}/dig-source.zip
          retention-days: 1
