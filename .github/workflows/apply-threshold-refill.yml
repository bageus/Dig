name: Apply Threshold Refill

on:
  push:
    branches:
      - agent/slow-needs-alternating-supply-tent-food

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/slow-needs-alternating-supply-tent-food
          fetch-depth: 0

      - name: Verify and apply threshold refill bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/threshold-refill.bundle.* > /tmp/threshold-refill.bundle.b64
          echo "653afb112d0872eb806f00b0d78e3b2b2ef657ed796e01cee68e26b5b6ec75bc  /tmp/threshold-refill.bundle.b64" | sha256sum --check --strict
          base64 --decode /tmp/threshold-refill.bundle.b64 > /tmp/threshold-refill.bundle.tgz
          echo "f88e6bebe784d8e38daf2eded56a7c33813dcebc1994d79110ee75cbbce5d7be  /tmp/threshold-refill.bundle.tgz" | sha256sum --check --strict
          rm -rf /tmp/threshold-refill
          mkdir -p /tmp/threshold-refill
          tar -xzf /tmp/threshold-refill.bundle.tgz -C /tmp/threshold-refill
          echo "9c616b655306329373d9a101ffe58894dc465a838d3f541f511a4fed00c80307  /tmp/threshold-refill/threshold-refill.patch" | sha256sum --check --strict
          git apply --check /tmp/threshold-refill/threshold-refill.patch
          git apply /tmp/threshold-refill/threshold-refill.patch
          cp /tmp/threshold-refill/docs/design/runtime-needs-supply-sleep-food-recovery.md docs/design/runtime-needs-supply-sleep-food-recovery.md
          rm -f .github/threshold-refill.bundle.*
          rm -f .github/workflows/apply-threshold-refill.yml

      - name: Commit threshold refill implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement threshold-driven internal supply"
          git push origin HEAD:agent/slow-needs-alternating-supply-tent-food
