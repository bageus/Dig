name: Normalize building work resolver

on:
  push:
    branches:
      - agent/fix-hud-basket-placement-building-work-position

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-hud-basket-placement-building-work-position
          fetch-depth: 0
      - name: Make side positions authoritative for save and runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Dig.Domain/Buildings/BuildingDefinitions.cs')
          text = path.read_text(encoding='utf-8')
          old = '''    public IReadOnlyList<CellId> ResolveWorkPositions(
        CellId origin,
        BuildingOrientation orientation)
    {
        return new ReadOnlyCollection<CellId>(_workPositions
            .Select(offset => offset.Rotate(orientation).Apply(origin))
            .OrderBy(cell => cell)
            .ToArray());
    }
'''
          new = '''    public IReadOnlyList<CellId> ResolveWorkPositions(
        CellId origin,
        BuildingOrientation orientation)
    {
        IReadOnlyList<CellId> footprint = ResolveFootprint(origin, orientation);
        int minimumX = footprint.Min(cell => cell.X);
        int maximumX = footprint.Max(cell => cell.X);
        return new ReadOnlyCollection<CellId>(new[]
        {
            new CellId(minimumX - 1, origin.Y, origin.Z),
            new CellId(maximumX + 1, origin.Y, origin.Z),
        });
    }
'''
          if old not in text:
              raise SystemExit('legacy work-position resolver not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/normalize-building-work-resolver.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Dig.Domain/Buildings/BuildingDefinitions.cs
          git commit -m "Make building side work positions authoritative"
          git push origin HEAD:agent/fix-hud-basket-placement-building-work-position
