name: Apply HUD basket decisions

on:
  push:
    branches:
      - agent/fix-hud-basket-placement-building-work-position

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-hud-basket-placement-building-work-position
          fetch-depth: 0
      - name: Apply authoritative documentation patch
        shell: bash
        run: |
          base64 -d .agent/docs-update.patch.gz.b64 | gzip -d > /tmp/docs-update.patch
          git apply --check /tmp/docs-update.patch
          git apply /tmp/docs-update.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Record HUD basket and work-position decisions"
          git push origin HEAD:agent/fix-hud-basket-placement-building-work-position
