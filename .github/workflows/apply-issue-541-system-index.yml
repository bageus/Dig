name: Apply issue 541 system index

on:
  push:
    branches:
      - agent/issue-541-system-index

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-541-system-index
          fetch-depth: 0
      - name: Update system index and remove workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/systems/README.md")
          text = path.read_text(encoding="utf-8")
          old_terrain = "| Terrain resources и output commit | ore, terrain profile, mining drop, output ledger | `IMPLEMENTED` | [`../design/terrain-resource-output-and-processing.md`](../design/terrain-resource-output-and-processing.md), [`../design/content/materials.md`](../design/content/materials.md) | [`../implementation/mining-output-save-data-contract.md`](../implementation/mining-output-save-data-contract.md), [`../implementation/issues-92-109-terrain-output-2026-07-30.md`](../implementation/issues-92-109-terrain-output-2026-07-30.md), [#92](https://github.com/bageus/Dig/issues/92), [#109](https://github.com/bageus/Dig/issues/109) |"
          new_terrain = "| Terrain resources и output commit | ore, terrain profile, mining drop, output ledger | `IMPLEMENTED` | [`../design/terrain-resource-output-and-processing.md`](../design/terrain-resource-output-and-processing.md), [`../design/content/materials.md`](../design/content/materials.md) | [`../implementation/mining-output-save-data-contract.md`](../implementation/mining-output-save-data-contract.md), [`../implementation/issues-92-109-terrain-output-2026-07-30.md`](../implementation/issues-92-109-terrain-output-2026-07-30.md), [`../implementation/issue-541-demo-terrain-regions-and-deposits-2026-08-01.md`](../implementation/issue-541-demo-terrain-regions-and-deposits-2026-08-01.md), [#92](https://github.com/bageus/Dig/issues/92), [#109](https://github.com/bageus/Dig/issues/109), [#541](https://github.com/bageus/Dig/issues/541), [PR #544](https://github.com/bageus/Dig/pull/544) |"
          old_deposits = "| Deposits и depletion | resource veins, coal, crystal | `IMPLEMENTED` | [`../design/excavation-room-templates-and-deposits.md`](../design/excavation-room-templates-and-deposits.md), [`../design/terrain-resource-output-and-processing.md`](../design/terrain-resource-output-and-processing.md) | [`../implementation/issue-91-deterministic-deposits-2026-07-30.md`](../implementation/issue-91-deterministic-deposits-2026-07-30.md), [#91](https://github.com/bageus/Dig/issues/91) |"
          new_deposits = "| Deposits и depletion | resource veins, coal, crystal | `IMPLEMENTED` | [`../design/excavation-room-templates-and-deposits.md`](../design/excavation-room-templates-and-deposits.md), [`../design/terrain-resource-output-and-processing.md`](../design/terrain-resource-output-and-processing.md) | [`../implementation/issue-91-deterministic-deposits-2026-07-30.md`](../implementation/issue-91-deterministic-deposits-2026-07-30.md), [`../implementation/issue-541-demo-terrain-regions-and-deposits-2026-08-01.md`](../implementation/issue-541-demo-terrain-regions-and-deposits-2026-08-01.md), [#91](https://github.com/bageus/Dig/issues/91), [#541](https://github.com/bageus/Dig/issues/541), [PR #544](https://github.com/bageus/Dig/pull/544) |"
          if text.count(old_terrain) != 1 or text.count(old_deposits) != 1:
              raise SystemExit("Expected system index rows were not found exactly once")
          text = text.replace(old_terrain, new_terrain).replace(old_deposits, new_deposits)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/apply-issue-541-system-index.yml").unlink()
      - name: Commit system index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/systems/README.md .github/workflows/apply-issue-541-system-index.yml
          git commit -m "Track issue 541 terrain regression in system index"
          git push origin HEAD:agent/issue-541-system-index
