name: Apply Unity input parser fix

on:
  push:
    branches:
      - fix/unity-input-parser-merge-regressions

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/agent/unity-input-parser-fix.patch.gz.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/unity-input-parser-merge-regressions
          fetch-depth: 0

      - name: Apply reviewed correction
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/agent/unity-input-parser-fix.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/unity-input-parser-fix.patch
          echo "9c3842089172c0aa2081bfb519b75b698c95a8c026eec64c620d5dc82f59c8c5  /tmp/unity-input-parser-fix.patch" \
            | sha256sum --check
          git apply --check /tmp/unity-input-parser-fix.patch
          git apply --index /tmp/unity-input-parser-fix.patch
          rm -f \
            .github/agent/unity-input-parser-fix.patch.gz.b64 \
            .github/workflows/apply-unity-input-parser-fix.yml
          rmdir .github/agent 2>/dev/null || true
          git add -A
          git diff --cached --check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git commit -m "Fix Unity input parser merge regressions"
          git push origin HEAD:fix/unity-input-parser-merge-regressions
