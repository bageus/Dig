name: Apply basket alignment

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agent/basket-patch-*"
      - ".github/workflows/apply-basket-alignment.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/align-surface-baskets-and-cargo-fallback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/align-surface-baskets-and-cargo-fallback
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/basket-patch-* | base64 -d | gzip -d > /tmp/basket.patch
          git apply --unidiff-zero --check /tmp/basket.patch
          git apply --unidiff-zero /tmp/basket.patch

      - name: Publish code tests and documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src tests unity
          git commit -m "Align surface baskets and Cargo fallback"
          git push origin HEAD:agent/align-surface-baskets-and-cargo-fallback
