name: Apply issues 92 and 109 regression fix

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issues-92-109-terrain-output' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-92-109-terrain-output
          fetch-depth: 0
      - name: Apply regression fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .agent/fix-92-109-regressions.patch
          git apply --index .agent/fix-92-109-regressions.patch
          git rm .agent/fix-92-109-regressions.patch
          git rm .github/workflows/apply-92-109-regression-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix mining output reservation and duplicate commit regressions"
          git push origin HEAD:agent/issues-92-109-terrain-output
