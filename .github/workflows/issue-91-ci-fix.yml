name: Apply issue 91 CI fix

on:
  push:
    branches:
      - agent/issue-91-deterministic-deposits

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/issue-91-deterministic-deposits
          fetch-depth: 0

      - name: Apply focused CI corrections
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              content = file.read_text()
              if old not in content:
                  raise SystemExit(f"Expected text was not found in {path}")
              file.write_text(content.replace(old, new, 1))

          replace(
              "src/Dig.Application/Jobs/TerrainWorkCompletionUseCases.cs",
              "        EnsureCommitStep(terrain.IsSuccess, terrain.Error);\n\n        if (command.ProducesOutput)",
              "        if (terrain.IsFailure)\n        {\n            return Result<TerrainWorkCompletionResult>.Failure(terrain.Error!);\n        }\n\n        if (command.ProducesOutput)")

          replace(
              "tests/Dig.Tests/SaveMigrationAndCorruptionTests.cs",
              "            \"save.v9_to_v10.combat_spatial\",\n        }, first.Value.AppliedSteps);",
              "            \"save.v9_to_v10.combat_spatial\",\n            \"save.v10_to_v11.terrain_deposit_contract\",\n        }, first.Value.AppliedSteps);")

          replace(
              "tests/Dig.Tests/SaveMigrationAndCorruptionTests.cs",
              "                \"save.v9_to_v10.combat_spatial\",\n            },\n            first.Value.AppliedSteps);",
              "                \"save.v9_to_v10.combat_spatial\",\n                \"save.v10_to_v11.terrain_deposit_contract\",\n            },\n            first.Value.AppliedSteps);")

          replace(
              "tests/Dig.Tests/TerrainDepositStateTests.cs",
              "        source.ReplaceAll(new[] { depleted, revealed });",
              "        source.ReplaceAll(new[] { depleted, revealed }, generatorVersion: 4);")

          replace(
              "tests/Dig.Tests/SaveGameServiceMiningOutputIntegrationTests.cs",
              "            loadedManual.Value.PackableBuildingExecutions,\n            loadedManual.Value.MiningOutput.Commits));",
              "            loadedManual.Value.PackableBuildingExecutions,\n            loadedManual.Value.MiningOutput.Commits,\n            terrainDepositGeneratorVersion:\n                loadedManual.Value.TerrainDepositGeneratorVersion));")

          Path(".github/workflows/issue-91-ci-fix.yml").unlink()

      - name: Commit corrected head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix issue 91 regression contracts"
          git push origin HEAD:agent/issue-91-deterministic-deposits
