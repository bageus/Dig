name: Apply post excavation topology

on:
  push:
    branches:
      - fix/post-excavation-topology-and-gravity-v2
    paths:
      - .github/workflows/apply-post-excavation-topology.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-excavation-topology-and-gravity-v2
          fetch-depth: 0
      - name: Apply post-excavation topology patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/post-excavation-topology-*.b64 \
            | base64 -d > /tmp/post-excavation-topology.patch
          git apply --check /tmp/post-excavation-topology.patch
          git apply /tmp/post-excavation-topology.patch
          git rm .github/workflows/apply-post-excavation-topology.yml
          git rm .github/patches/post-excavation-topology-*.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: synchronize post-excavation topology"
          git push origin HEAD:fix/post-excavation-topology-and-gravity-v2
