name: Apply issue 88 closure patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-88-authoritative-xyz-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply prepared patch
        shell: bash
        run: |
          cat .agent/issue88.patch.gz.b64.* | base64 --decode | gzip --decompress > /tmp/issue88.patch
          if ! git apply --check /tmp/issue88.patch; then
            echo "Patch is already applied or the branch moved; no bootstrap commit needed."
            exit 0
          fi
          git apply --index /tmp/issue88.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete authoritative XYZ closure"
          git push origin HEAD:${{ github.head_ref }}
