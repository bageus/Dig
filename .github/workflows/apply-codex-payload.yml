name: Apply Codex implementation payload

on:
  push:
    branches:
      - codex/fix-campfire-and-reinforcement-entrypoints
    paths:
      - .github/workflows/apply-codex-payload.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-campfire-and-reinforcement-entrypoints
          fetch-depth: 0
      - name: Apply source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .codex-payload/part-* | base64 --decode | tar -xz
          rm -rf .codex-payload
          rm -f .github/workflows/apply-codex-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement room purpose and manual tunnel reinforcement runtime"
          git push origin HEAD:codex/fix-campfire-and-reinforcement-entrypoints
