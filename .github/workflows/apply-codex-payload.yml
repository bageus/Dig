name: Apply Codex implementation payload

on:
  push:
    branches:
      - codex/fix-campfire-and-reinforcement-entrypoints
    paths:
      - .github/workflows/apply-codex-payload.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-campfire-and-reinforcement-entrypoints
          fetch-depth: 0
      - name: Verify and apply source payload
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .codex-payload/part-000
            cat .codex-payload/part-001
            cat .codex-payload/part-002
            cat .codex-payload-third/part-*
            cat .codex-payload-tail/part-*
          } > /tmp/payload.b64
          echo "165622f90e44b18dfc2ce0cae9ae9a2c1a58c3527612b3bcd0f6ce71e21f20cf  /tmp/payload.b64" | sha256sum -c -
          base64 --decode /tmp/payload.b64 | tar -xz
          rm -rf .codex-payload .codex-payload-third .codex-payload-tail
          rm -f .github/workflows/apply-codex-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement room purpose and manual tunnel reinforcement runtime"
          git push origin HEAD:codex/fix-campfire-and-reinforcement-entrypoints
