name: Apply persistent partial excavation

on:
  push:
    branches:
      - agent/fix-persistent-partial-excavation-v2
    paths:
      - .github/workflows/apply-persistent-partial-excavation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-persistent-partial-excavation-v2
          fetch-depth: 0
      - name: Apply implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/persistent-partial-excavation-*.b64 \
            | base64 -d > /tmp/persistent-partial-excavation.patch
          git apply --check /tmp/persistent-partial-excavation.patch
          git apply /tmp/persistent-partial-excavation.patch
          git rm .github/workflows/apply-persistent-partial-excavation.yml
          git rm .github/patches/persistent-partial-excavation-*.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: persist partial excavation geometry"
          git push origin HEAD:agent/fix-persistent-partial-excavation-v2
