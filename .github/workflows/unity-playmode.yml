name: Unity Play Mode

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/unity-playmode.yml"
      - "src/**"
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "tools/quality/validate_unity_runtime_evidence.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unity-playmode.yml"
      - "src/**"
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "tools/quality/validate_unity_runtime_evidence.py"

permissions:
  contents: read
  checks: write

jobs:
  unity-tests:
    name: Unity 6000.0.71f1 EditMode + PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_VERSION: 6000.0.71f1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Unity activation
        id: activation
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          set -euo pipefail
          configured=true
          reason=""
          if [[ -z "${UNITY_EMAIL}" || -z "${UNITY_PASSWORD}" ]]; then
            configured=false
            reason="UNITY_EMAIL and UNITY_PASSWORD are not configured"
          elif [[ -z "${UNITY_LICENSE}" && -z "${UNITY_SERIAL}" ]]; then
            configured=false
            reason="UNITY_LICENSE for Personal or UNITY_SERIAL for Pro is not configured"
          fi
          echo "configured=${configured}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          if [[ "${configured}" == "true" ]]; then
            echo "Unity activation inputs are configured."
          else
            echo "::warning title=Unity runtime tests blocked::${reason}. Add repository Actions secrets to produce licensed runtime evidence."
          fi

      - name: Cache Unity Library
        if: steps.activation.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-6000.0.71f1-${{ hashFiles('Packages/**', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-${{ runner.os }}-6000.0.71f1-

      - name: Run Unity EditMode and PlayMode tests
        if: steps.activation.outputs.configured == 'true'
        id: unity_tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.0.71f1
          testMode: All
          artifactsPath: artifacts/unity-tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Dig Unity EditMode + PlayMode

      - name: Validate executed Unity runtime evidence
        if: always() && steps.activation.outputs.configured == 'true'
        shell: bash
        run: |
          python tools/quality/validate_unity_runtime_evidence.py \
            --artifacts-dir artifacts/unity-tests \
            --manifest artifacts/unity-runtime-evidence.json \
            --required-test "EditMode=Dig.Unity.EditModeTests.UnityProjectEditModeTests.Main_scene_is_registered_with_runtime_bootstrap" \
            --required-test "PlayMode=Dig.Unity.PlayModeTests.RepresentativeSceneConsolePlayModeTests.Main_scene_bootstraps_without_console_errors" \
            --required-log "runtime/representative-scene.log"

      - name: Record blocked runtime evidence
        if: steps.activation.outputs.configured != 'true'
        shell: bash
        run: |
          python tools/quality/validate_unity_runtime_evidence.py \
            --artifacts-dir artifacts/unity-tests \
            --manifest artifacts/unity-runtime-evidence.json \
            --required-test "EditMode=Dig.Unity.EditModeTests.UnityProjectEditModeTests.Main_scene_is_registered_with_runtime_bootstrap" \
            --required-test "PlayMode=Dig.Unity.PlayModeTests.RepresentativeSceneConsolePlayModeTests.Main_scene_bootstraps_without_console_errors" \
            --blocked-reason "${{ steps.activation.outputs.reason }}"
          {
            echo "## Unity runtime evidence blocked"
            echo
            echo "${{ steps.activation.outputs.reason }}."
            echo "The workflow conclusion alone is not verification. Inspect the unity-runtime-evidence artifact."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=Unity runtime tests not executed::${{ steps.activation.outputs.reason }}"
          exit 1

      - name: Upload Unity test results
        if: always() && steps.activation.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-playmode-results
          path: artifacts/unity-tests
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity runtime evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-runtime-evidence
          path: artifacts/unity-runtime-evidence.json
          if-no-files-found: error
          retention-days: 30
