name: Unity Play Mode

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/unity-playmode.yml"
      - "src/**"
      - "unity/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unity-playmode.yml"
      - "src/**"
      - "unity/**"

permissions:
  contents: read
  checks: write

jobs:
  playmode:
    name: Unity 6000.0.71f1 Play Mode
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          show-progress: false

      - name: Resolve Unity activation
        id: activation
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          set -euo pipefail
          configured=true
          reason=""
          if [[ -z "${UNITY_EMAIL}" || -z "${UNITY_PASSWORD}" ]]; then
            configured=false
            reason="UNITY_EMAIL and UNITY_PASSWORD are not configured"
          elif [[ -z "${UNITY_LICENSE}" && -z "${UNITY_SERIAL}" ]]; then
            configured=false
            reason="UNITY_LICENSE for Personal or UNITY_SERIAL for Pro is not configured"
          fi
          echo "configured=${configured}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          if [[ "${configured}" == "true" ]]; then
            echo "Unity activation inputs are configured."
          else
            echo "::warning title=Unity Play Mode skipped::${reason}. Add repository Actions secrets to produce licensed runtime evidence."
          fi

      - name: Cache Unity Library
        if: steps.activation.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: unity/Dig.Unity/Library
          key: unity-library-${{ runner.os }}-6000.0.71f1-${{ hashFiles('unity/Dig.Unity/Packages/**', 'unity/Dig.Unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-${{ runner.os }}-6000.0.71f1-

      - name: Run Play Mode tests
        if: steps.activation.outputs.configured == 'true'
        id: playmode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity/Dig.Unity
          unityVersion: 6000.0.71f1
          testMode: PlayMode
          artifactsPath: artifacts/playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Dig Unity Play Mode

      - name: Record skipped runtime evidence
        if: steps.activation.outputs.configured != 'true'
        shell: bash
        run: |
          {
            echo "## Unity Play Mode not executed"
            echo
            echo "${{ steps.activation.outputs.reason }}."
            echo "The PR check is not a test failure; licensed Play Mode evidence remains pending."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Play Mode results
        if: always() && steps.activation.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-playmode-results
          path: artifacts/playmode
          if-no-files-found: warn
          retention-days: 14
