name: Apply rebased runtime fix

on:
  push:
    branches:
      - fix/runtime-interactions-rebased
    paths:
      - .github/workflows/apply-rebased-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebased branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-interactions-rebased
          fetch-depth: 0
          show-progress: false
      - name: Apply rebased runtime sources
        shell: bash
        run: |
          set -euo pipefail
          cat .rebased-patch/part-* | tr -d '\r\n\t ' | base64 --decode | gzip -dc > /tmp/rebased.patch
          git apply --check /tmp/rebased.patch
          git apply /tmp/rebased.patch
          rm -rf .rebased-patch
          rm -f .github/workflows/apply-rebased-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix runtime selection, item placement and excavation continuation"
          git push origin HEAD:fix/runtime-interactions-rebased
