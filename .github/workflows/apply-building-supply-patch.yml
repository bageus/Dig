name: Apply building supply source patch

on:
  push:
    branches:
      - bugfix/building-supply-navigation-recovery
    paths:
      - .github/workflows/apply-building-supply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bugfix branch
        uses: actions/checkout@v4
        with:
          ref: bugfix/building-supply-navigation-recovery
          fetch-depth: 0

      - name: Verify and apply exact source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .patchparts/part-* | base64 --decode > /tmp/building-supply-patch.tar.gz
          echo "fa6c1835bd4f5a6ea13ec64d638882d0c8a4b28467f42fd1d234b3eb79a3e69d  /tmp/building-supply-patch.tar.gz" | sha256sum --check -
          tar -xzf /tmp/building-supply-patch.tar.gz
          rm -rf .patchparts
          rm .github/workflows/apply-building-supply-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover building supply navigation and production demand"
          git push origin HEAD:bugfix/building-supply-navigation-recovery
