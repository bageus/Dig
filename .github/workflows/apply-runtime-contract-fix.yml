name: Apply runtime contract fix

on:
  push:
    branches:
      - agent/fix-runtime-building-ui-health-unpack-pickup

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Align runtime correction contracts') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-contract correction
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/runtime-contract-fix.patch.gz.b64 | gzip -d > /tmp/runtime-contract-fix.patch
          patch -p1 -E --forward < /tmp/runtime-contract-fix.patch
          rm tools/runtime-contract-fix.patch.gz.b64
          rm .github/workflows/apply-runtime-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align runtime correction contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
