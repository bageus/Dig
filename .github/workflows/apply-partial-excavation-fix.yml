name: Apply partial excavation geometry fix

on:
  push:
    branches:
      - agent/fix-excavation-room-placement
    paths:
      - .github/workflows/apply-partial-excavation-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-excavation-room-placement
          fetch-depth: 0
      - name: Apply implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/partial-excavation.patch
          git apply --check /tmp/partial-excavation.patch
          git apply /tmp/partial-excavation.patch
          git rm .github/workflows/apply-partial-excavation-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: persist partial excavation geometry"
          git push origin HEAD:agent/fix-excavation-room-placement
