name: Fix Root Path Tests

on:
  push:
    branches: [chore/unify-unity-project]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Rewrite remaining nested Unity path constructors and test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(r',\s*"unity"\s*,\s*"Dig\.Unity"\s*,\s*"Assets"')
          for path in Path('tests').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(', "Assets"', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append((str(path), count))
          if not changed:
              raise SystemExit('No old nested Unity path constructors were found')
          print(f'Updated {sum(c for _, c in changed)} path constructors across {len(changed)} test files')
          for path, count in changed:
              print(f'{count:3} {path}')
          PY

          if grep -RInE '"unity"[[:space:]]*,[[:space:]]*"Dig\.Unity"' tests --include='*.cs'; then
            echo 'Remaining nested Unity path constructor found in tests' >&2
            exit 1
          fi

          dotnet restore Dig.sln
          dotnet build Dig.sln --configuration Release --no-restore
          dotnet test Dig.sln --configuration Release --no-build --verbosity normal

          git restore --source=HEAD -- .github/workflows
          git add tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: resolve Unity assets from repository root'
          git push origin HEAD:chore/unify-unity-project
