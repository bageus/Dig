name: Fix Root Path Tests

on:
  push:
    branches: [chore/unify-unity-project]

permissions:
  contents: read

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Rewrite stale Unity paths and repository-root checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path_pattern = re.compile(r'"unity"\s*,\s*"Dig\.Unity"\s*,\s*')
          root_pattern = re.compile(
              r'Directory\.Exists\(Path\.Combine\(current\.FullName,\s*"unity"(?:\s*,\s*"Dig\.Unity")?\s*\)\)'
          )
          changed = []
          path_replacements = 0
          root_replacements = 0
          for path in Path('tests').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              updated, path_count = path_pattern.subn('', text)
              updated, root_count = root_pattern.subn(
                  'File.Exists(Path.Combine(current.FullName, "Dig.sln"))', updated
              )
              if path_count or root_count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  path_replacements += path_count
                  root_replacements += root_count
          print(
              f'Updated {path_replacements} stale path constructors and '
              f'{root_replacements} repository-root checks across {len(changed)} test files'
          )
          if not changed:
              raise SystemExit('Expected stale Unity test paths/root checks, but none were found')
          PY
          git diff --check
          git diff -- tests > root-path-tests.patch
      - name: Restore
        run: dotnet restore Dig.sln
      - name: Build
        run: dotnet build Dig.sln --configuration Release --no-restore
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Dig.sln --configuration Release --no-build --verbosity normal 2>&1 | tee root-path-test.log
      - name: Stage fixed test files
        if: always()
        shell: bash
        run: |
          mkdir -p root-path-fix
          cp --parents $(git diff --name-only -- tests) root-path-fix/ || true
          cp root-path-tests.patch root-path-fix/ || true
          cp root-path-test.log root-path-fix/ || true
      - name: Upload fixed tests and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-path-test-fix
          path: root-path-fix
          if-no-files-found: error
          retention-days: 1
