name: Fix Root Path Tests

on:
  push:
    branches: [chore/unify-unity-project]

permissions:
  contents: read

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Rewrite stale Unity paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'"unity"\s*,\s*"Dig\.Unity"\s*,\s*')
          changed = []
          replacements = 0
          for path in Path('tests').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  replacements += count
          print(f'Updated {replacements} stale path constructors across {len(changed)} test files')
          if not changed:
              raise SystemExit('Expected stale unity/Dig.Unity test paths, but none were found')
          PY
          git diff --check
          git diff -- tests > root-path-tests.patch
      - name: Restore
        run: dotnet restore Dig.sln
      - name: Build
        run: dotnet build Dig.sln --configuration Release --no-restore
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Dig.sln --configuration Release --no-build --verbosity normal 2>&1 | tee root-path-test.log
      - name: Stage fixed test files
        if: always()
        shell: bash
        run: |
          mkdir -p root-path-fix
          cp --parents $(git diff --name-only -- tests) root-path-fix/ || true
          cp root-path-tests.patch root-path-fix/ || true
          cp root-path-test.log root-path-fix/ || true
      - name: Upload fixed tests and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-path-test-fix
          path: root-path-fix
          if-no-files-found: error
          retention-days: 1
