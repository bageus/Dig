name: Fix Root Path Tests

on:
  push:
    branches: [chore/unify-unity-project]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Rewrite stale Unity paths, verify tests, and publish
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'"unity"\s*,\s*"Dig\.Unity"\s*,\s*')
          changed = []
          replacements = 0
          for path in Path('tests').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  replacements += count

          if not changed:
              raise SystemExit('Expected stale unity/Dig.Unity test paths, but none were found')

          print(f'Updated {replacements} stale path constructors across {len(changed)} test files')
          PY

          if grep -RInE '"unity"[[:space:]]*,[[:space:]]*"Dig\.Unity"' tests --include='*.cs'; then
            echo 'Remaining stale nested Unity path constructor found in tests' >&2
            exit 1
          fi

          dotnet restore Dig.sln
          dotnet build Dig.sln --configuration Release --no-restore
          dotnet test Dig.sln --configuration Release --no-build --verbosity normal

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git rm .github/workflows/fix-root-path-tests.yml
          git commit -m 'test: resolve Unity assets from repository root'

          git fetch origin chore/unify-unity-project
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/chore/unify-unity-project)" || {
            echo 'Branch moved while fixer was running; refusing non-fast-forward push' >&2
            exit 1
          }
          git push origin HEAD:chore/unify-unity-project
