name: Fix Root Path Tests

on:
  push:
    branches: [chore/unify-unity-project]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Rewrite, verify, and publish test migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path_pattern = re.compile(r'"unity"\s*,\s*"Dig\.Unity"\s*,\s*')
          root_pattern = re.compile(
              r'Directory\.Exists\(Path\.Combine\(current\.FullName,\s*"unity"(?:\s*,\s*"Dig\.Unity")?\s*\)\)'
          )
          changed = []
          path_replacements = 0
          root_replacements = 0
          for path in Path('tests').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              updated, path_count = path_pattern.subn('', text)
              updated, root_count = root_pattern.subn(
                  'File.Exists(Path.Combine(current.FullName, "Dig.sln"))', updated
              )
              if path_count or root_count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  path_replacements += path_count
                  root_replacements += root_count
          print(
              f'Updated {path_replacements} stale path constructors and '
              f'{root_replacements} repository-root checks across {len(changed)} test files'
          )
          PY

          if git diff --quiet -- tests; then
            echo 'Root-path test migration is already applied.'
            exit 0
          fi

          git diff --check
          dotnet restore Dig.sln
          dotnet build Dig.sln --configuration Release --no-restore
          dotnet test Dig.sln --configuration Release --no-build --verbosity normal

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'test: resolve Unity project paths from repository root'

          git fetch origin chore/unify-unity-project
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/chore/unify-unity-project)" || {
            echo 'Branch moved while fixer was running; refusing non-fast-forward push' >&2
            exit 1
          }
          git push origin HEAD:chore/unify-unity-project
