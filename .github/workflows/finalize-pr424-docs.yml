name: Finalize PR 424 documentation

on:
  push:
    branches:
      - docs/mushroom-growth-questionnaire

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mushroom-growth-questionnaire
      - name: Register mushroom system and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/systems/README.md')
          text = path.read_text(encoding='utf-8')
          chat_row = '| Рост и прямая рубка грибов | гриб, mushroom, дерево, рубка, топор, regrowth, mushroom cap, mushroom leg, woodworking | `APPROVED` | [`mushroom-growth-and-chopping.md`](../design/mushroom-growth-and-chopping.md) | [#423](https://github.com/bageus/Dig/issues/423) |'
          ecology_row = '| Mushroom growth sites и direct chopping | гриб, tree-like harvest, axe cursor, regrowth, cap, leg, woodworking | `APPROVED` | [`../design/mushroom-growth-and-chopping.md`](../design/mushroom-growth-and-chopping.md) | [`../implementation/mushroom-growth-and-chopping.md`](../implementation/mushroom-growth-and-chopping.md), [#423](https://github.com/bageus/Dig/issues/423) |'
          if chat_row not in text:
              anchor = '| Demo campfire + packed box | нижняя пещера, готовый костёр, коробка костра | `QUESTIONNAIRE` | [`demo-starting-scenario.md`](../design/demo-starting-scenario.md) | [#389](https://github.com/bageus/Dig/issues/389) |'
              text = text.replace(anchor, anchor + '\n' + chat_row)
          if ecology_row not in text:
              anchor = '| Creatures и ecology | spawn, drops, behavior | `APPROVED` | [`../design/ecology-creatures-and-special-drops.md`](../design/ecology-creatures-and-special-drops.md) | [`../implementation/unity-creature-visual-pipeline.md`](../implementation/unity-creature-visual-pipeline.md) |'
              text = text.replace(anchor, ecology_row + '\n' + anchor)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/finalize-pr424-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/systems/README.md .github/workflows/finalize-pr424-docs.yml
          git commit -m "Finalize mushroom system index"
          git push origin HEAD:docs/mushroom-growth-questionnaire
