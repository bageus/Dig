name: Execute inventory and mushroom regression fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/inventory-column-order-and-mushroom-chopping'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Commit authoritative documentation first
        shell: bash
        run: |
          python3 tools/maintenance/apply_inventory_mushroom_regression.py docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/resident-inventory-expansion.md \
            docs/design/mushroom-growth-and-chopping.md \
            docs/implementation/supported-stationary-action-positions-2026-07-30.md \
            docs/implementation/hud-basket-placement-and-building-work-position-2026-07-29.md
          git commit -m "docs: clarify inventory order and mushroom travel"

      - name: Apply runtime and regression fixes
        shell: bash
        run: |
          python3 tools/maintenance/apply_inventory_mushroom_regression.py code
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/quality/unity_gameplay_hud_contracts.py')
          text = path.read_text(encoding='utf-8')
          old = '''            "InventoryCellHeight = 76f",
            '"WEAPON"',
            "GridLayoutGroup.Axis.Horizontal",
            "GridLayoutGroup.Constraint.FixedColumnCount",
            "constraintCount = columns",
'''
          new = '''            "InventoryCellHeight = 76f", '"WEAPON"', "GridLayoutGroup.Axis.Horizontal", "GridLayoutGroup.Constraint.FixedColumnCount", "constraintCount = columns",
'''
          if text.count(old) != 1:
              raise SystemExit('quality rejection block was not generated exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-inventory-mushroom-regression-fix.yml
          rm .github/workflows/execute-inventory-mushroom-regression-fix.yml
          rm tools/maintenance/apply_inventory_mushroom_regression.py

      - name: Run repository quality gates
        run: |
          python3 tools/quality/check_quality.py
          python3 tools/quality/check_unity_source_contracts.py

      - name: Restore and test
        run: |
          dotnet restore Dig.sln
          dotnet test Dig.sln -c Release --no-restore

      - name: Commit clean implementation
        shell: bash
        run: |
          git add -A
          git commit -m "fix: restore mushroom chopping and inventory slot order"
          git push origin HEAD:${{ github.head_ref }}
