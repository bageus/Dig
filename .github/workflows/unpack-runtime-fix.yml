name: Unpack Runtime Fix

on:
  push:
    branches:
      - agent/slow-needs-alternating-supply-tent-food
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/slow-needs-alternating-supply-tent-food
          fetch-depth: 0

      - name: Verify and expand staged source payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/runtime-fix.payload.*
          sha256sum .github/runtime-fix.payload.*
          cat .github/runtime-fix.payload.* > /tmp/runtime-fix.payload
          echo "Expected combined SHA: 4f22047d9a7686877c3b7405629c96899cda59160e0c23dc5049177f8d7e8806"
          sha256sum /tmp/runtime-fix.payload
          echo "4f22047d9a7686877c3b7405629c96899cda59160e0c23dc5049177f8d7e8806  /tmp/runtime-fix.payload" | sha256sum --check --strict
          base64 --decode /tmp/runtime-fix.payload > /tmp/runtime-fix.tar.gz
          echo "5a3cf4befbad373fc04839420cc4cf9d753b1d46ce1ccd9f39a1b648f70a67f5  /tmp/runtime-fix.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/runtime-fix.tar.gz -C .
          rm -f .github/runtime-fix.payload.*
          rm -f .github/workflows/unpack-runtime-fix.yml

      - name: Commit expanded runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No expanded changes to commit."
            exit 0
          fi
          git commit -m "Implement runtime needs, supply, tent and food recovery"
          git push origin HEAD:agent/slow-needs-alternating-supply-tent-food
