name: Materialize sleeping resident fix

on:
  push:
    branches:
      - bugfix/sleeping-resident-roster-selection

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/sleeping-resident-roster-selection
          fetch-depth: 0
      - name: Apply reviewed source patch
        shell: bash
        run: |
          echo '' | base64 --decode | gunzip > /tmp/sleep-fix.patch
          git apply --check /tmp/sleep-fix.patch
          git apply /tmp/sleep-fix.patch
          rm .github/workflows/materialize-sleeping-resident-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix sleeping resident survival and selection"
          git push origin HEAD:bugfix/sleeping-resident-roster-selection
