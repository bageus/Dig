name: Apply issues 92 and 109 patch on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issues-92-109-terrain-output' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-92-109-terrain-output
          fetch-depth: 0
      - name: Apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .agent/issue92-109.patch.gz.b64 | gzip -d > /tmp/issue92-109.patch
          git apply --index /tmp/issue92-109.patch
          git rm .agent/issue92-109.patch.gz.b64
          git rm .github/workflows/apply-issues-92-109-patch.yml
          git rm .github/workflows/apply-issues-92-109-patch-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete terrain output profiles and atomic mining output"
          git push origin HEAD:agent/issues-92-109-terrain-output
