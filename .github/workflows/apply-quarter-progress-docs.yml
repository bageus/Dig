name: Apply quarter progress docs

on:
  push:
    branches:
      - agent/fix-excavation-room-placement
    paths:
      - .github/workflows/apply-quarter-progress-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-excavation-room-placement
          fetch-depth: 0
      - name: Apply authoritative documentation update
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/docs.patch.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/docs.patch.b64 > /tmp/docs.patch
          git apply --check /tmp/docs.patch
          git apply /tmp/docs.patch
          git rm .github/workflows/apply-quarter-progress-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/design/excavation-command-execution.md docs/design/runtime-selection-excavation-item-placement-decisions.md
          git commit -m "docs: define persistent partial excavation"
          git push origin HEAD:agent/fix-excavation-room-placement
