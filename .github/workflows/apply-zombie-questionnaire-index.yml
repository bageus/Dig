name: Apply zombie questionnaire index

on:
  push:
    branches:
      - feature/resident-death-cap-and-zombie-questionnaire
    paths:
      - .github/workflows/apply-zombie-questionnaire-index.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resident-death-cap-and-zombie-questionnaire
          fetch-depth: 0
      - name: Add questionnaire to system index
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/systems/README.md")
          text = path.read_text(encoding="utf-8")
          death = "| Death, graves и return | resurrection, rejuvenation | `APPROVED` | [`../design/death-graves-resurrection-and-rejuvenation.md`](../design/death-graves-resurrection-and-rejuvenation.md) | [`../implementation/society-lifecycle.md`](../implementation/society-lifecycle.md) |"
          zombie = "| Zombie mode: death conversion | zombie dwarf, no cap, hostile former resident | `QUESTIONNAIRE` | [`../design/zombie-mode-resident-death-questionnaire.md`](../design/zombie-mode-resident-death-questionnaire.md) | [#586](https://github.com/bageus/Dig/issues/586), parent [#150](https://github.com/bageus/Dig/issues/150) |"
          if zombie in text:
              raise SystemExit(0)
          if death not in text:
              raise SystemExit("Death system row was not found")
          path.write_text(text.replace(death, death + "\n" + zombie, 1), encoding="utf-8")
      - name: Commit index update
        run: |
          if git diff --quiet -- docs/systems/README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/systems/README.md
          git commit -m "Index zombie-mode death questionnaire"
          git push origin HEAD:feature/resident-death-cap-and-zombie-questionnaire
