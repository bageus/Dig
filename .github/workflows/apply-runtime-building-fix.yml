name: Apply runtime building fix

on:
  push:
    branches:
      - agent/fix-runtime-building-ui-health-unpack-pickup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prepared source patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/runtime-fix.patch.part-* > /tmp/runtime-fix.patch.gz.b64
          base64 -d /tmp/runtime-fix.patch.gz.b64 | gzip -d > /tmp/runtime-fix.patch
          patch -p1 -E --forward < /tmp/runtime-fix.patch
          rm tools/runtime-fix.patch.part-*
          rm .github/workflows/apply-runtime-building-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix runtime building UI, unpack and forced pickup"
          git push origin HEAD:${GITHUB_REF_NAME}
