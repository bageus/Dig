name: Agent export merge inputs

on:
  push:
    branches:
      - agent/fix-internal-stock-routing-and-production-workflow

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Export branch and merge base
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=/tmp/dig-branch-current.zip HEAD
          git archive --format=zip --output=/tmp/dig-merge-base.zip 8cb7e41c554a7b30c3624943899dc45d3db38b1a

      - name: Upload merge inputs
        uses: actions/upload-artifact@v4
        with:
          name: agent-merge-inputs
          path: |
            /tmp/dig-branch-current.zip
            /tmp/dig-merge-base.zip
          if-no-files-found: error

      - name: Publish run id and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/agent-merge-inputs-run.txt
          rm .github/workflows/agent-export-merge-inputs.yml
          git add -A
          git commit -m "Record production branch merge inputs export"
          git push origin "HEAD:${GITHUB_REF_NAME}"
