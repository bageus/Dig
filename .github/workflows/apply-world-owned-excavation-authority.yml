name: Apply World Owned Excavation Authority

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: world-owned-excavation-authority-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply-world-owned-excavation-authority:
    if: github.head_ref == 'fix/world-owned-excavation-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-owned-excavation-authority
          fetch-depth: 0
          show-progress: false
      - name: Apply authoritative excavation implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/world-owned-excavation-authority.part* > /tmp/excavation-authority.b64
          base64 -d /tmp/excavation-authority.b64 > /tmp/excavation-authority.patch.gz
          echo "f809280a99fd4a0244438d3f3f5951974becaa69eda9a4fd2321eb5cebd87e36  /tmp/excavation-authority.patch.gz" | sha256sum -c -
          gzip -dc /tmp/excavation-authority.patch.gz > /tmp/excavation-authority.patch
          echo "23e6da88c8ea75d1664dd9a5ca382420a7b4cb1ffb19a06f9450cf43e60d9dc2  /tmp/excavation-authority.patch" | sha256sum -c -
          git apply --check /tmp/excavation-authority.patch
          git apply /tmp/excavation-authority.patch
          git diff --check
          python tools/quality/check_quality.py
          python tools/quality/check_unity_source_contracts.py
          git rm .github/patches/world-owned-excavation-authority.part*
          git rm .github/workflows/apply-world-owned-excavation-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make excavation progress authoritative in world"
          git push origin HEAD:fix/world-owned-excavation-authority
