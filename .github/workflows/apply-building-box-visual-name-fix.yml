name: Apply BuildingBox visual contract naming fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-building-box-unpack-relocation-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rename lifecycle projection identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          roots = [Path('src'), Path('tests'), Path('unity')]
          for root in roots:
              for path in root.rglob('*.cs'):
                  source = path.read_text()
                  updated = source.replace(
                      'IsPendingBuildingBoxTransformation',
                      'IsPendingBuildingBoxLifecycle').replace(
                      'IsBuildingBoxTransformation',
                      'HasBuildingBoxLifecycle')
                  if updated != source:
                      path.write_text(updated)
          PY
          rm -f .github/workflows/apply-building-box-visual-name-fix.yml
          python tools/quality/check_unity_building_visual_contracts.py
          python tools/quality/check_quality.py
          python tools/quality/check_unity_source_contracts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Avoid BuildingBox visual contract name collision"
          git push origin HEAD:${{ github.head_ref }}
