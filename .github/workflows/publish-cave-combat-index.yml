name: Publish cave combat system index

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/cave-monster-combat' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cave-monster-combat
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update system index
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/systems/README.md')
          text = path.read_text(encoding='utf-8')
          chat_row = '| Пещерные враги и боевой vertical slice | cave monster, vuker, predatory vine, swallower, spider, health bar, weapon draw, combat balance | `QUESTIONNAIRE` | [`enemy-combat-and-cave-encounters.md`](../design/enemy-combat-and-cave-encounters.md) | [#559](https://github.com/bageus/Dig/issues/559) |\n'
          runtime_row = '| Enemy cave encounters and combat balance | cave monster, vuker, enemy hierarchy, weapon draw, health bars, skill-scaled damage | `QUESTIONNAIRE` | [`../design/enemy-combat-and-cave-encounters.md`](../design/enemy-combat-and-cave-encounters.md) | [#559](https://github.com/bageus/Dig/issues/559) |\n'
          if chat_row not in text:
              marker = '| Resident/building roster synchronization |'
              text = text.replace(marker, chat_row + marker, 1)
          if runtime_row not in text:
              marker = '| Combat knockback into shafts |'
              text = text.replace(marker, runtime_row + marker, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/publish-cave-combat-index.yml').unlink()
      - name: Commit index update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Index cave enemy combat system"
          git push origin HEAD:agent/cave-monster-combat
