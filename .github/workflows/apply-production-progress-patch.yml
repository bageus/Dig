name: Apply production progress patch

on:
  push:
    branches:
      - agent/production-progress-dependent-supply

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/production-progress-patch-* | base64 --decode > /tmp/production-progress-patch.tgz
          tar -xzf /tmp/production-progress-patch.tgz -C .
          rm -f .github/agent/production-progress-patch-*
          rm -f .github/workflows/apply-production-progress-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement production progress and dependent supply"
          git push origin HEAD:${GITHUB_REF_NAME}
