name: Finalize PR 424 implemented status

on:
  push:
    branches:
      - docs/mushroom-growth-questionnaire

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mushroom-growth-questionnaire
      - name: Mark mushroom system implemented and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/systems/README.md')
          text = path.read_text(encoding='utf-8')
          old_chat = '| Рост и прямая рубка грибов | гриб, mushroom, дерево, рубка, топор, regrowth, mushroom cap, mushroom leg, woodworking | `APPROVED` |'
          new_chat = '| Рост и прямая рубка грибов | гриб, mushroom, дерево, рубка, топор, regrowth, mushroom cap, mushroom leg, woodworking | `IMPLEMENTED` |'
          old_ecology = '| Mushroom growth sites и direct chopping | гриб, tree-like harvest, axe cursor, regrowth, cap, leg, woodworking | `APPROVED` |'
          new_ecology = '| Mushroom growth sites и direct chopping | гриб, tree-like harvest, axe cursor, regrowth, cap, leg, woodworking | `IMPLEMENTED` |'
          assert text.count(old_chat) == 1
          assert text.count(old_ecology) == 1
          path.write_text(text.replace(old_chat, new_chat).replace(old_ecology, new_ecology), encoding='utf-8')
          PY
          rm .github/workflows/finalize-pr424-implemented.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/systems/README.md .github/workflows/finalize-pr424-implemented.yml
          git commit -m "Mark mushroom system implemented"
          git push origin HEAD:docs/mushroom-growth-questionnaire
