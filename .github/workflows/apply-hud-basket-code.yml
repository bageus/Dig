name: Apply HUD basket implementation

on:
  push:
    branches:
      - agent/fix-hud-basket-placement-building-work-position

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-hud-basket-placement-building-work-position
          fetch-depth: 0
      - name: Apply reviewed implementation patch
        shell: bash
        run: |
          base64 -d .agent/code-update.patch.gz.b64 | gzip -d > /tmp/code-update.patch
          git apply --check /tmp/code-update.patch
          git apply /tmp/code-update.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src tests tools unity
          git commit -m "Fix bottom HUD basket placement and building work positions"
          git push origin HEAD:agent/fix-hud-basket-placement-building-work-position
