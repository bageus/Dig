name: Unify Unity Project v2

on:
  push:
    branches: [chore/unify-unity-project]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate, validate and publish
        shell: bash
        run: |
          set -euo pipefail
          test -d unity/Dig.Unity/Assets
          test -d unity/Dig.Unity/Packages
          test -d unity/Dig.Unity/ProjectSettings
          test -d Assets/DigDwarfs

          preserve="$(mktemp -d)"
          cp -a Assets/DigDwarfs "${preserve}/DigDwarfs"
          [[ ! -f Assets/DigDwarfs.meta ]] || cp -a Assets/DigDwarfs.meta "${preserve}/DigDwarfs.meta"

          git rm -r --ignore-unmatch Assets Packages ProjectSettings Library Logs Temp UserSettings
          mv unity/Dig.Unity/Assets Assets
          mv unity/Dig.Unity/Packages Packages
          mv unity/Dig.Unity/ProjectSettings ProjectSettings
          cp -a "${preserve}/DigDwarfs" Assets/DigDwarfs
          [[ ! -f "${preserve}/DigDwarfs.meta" ]] || cp -a "${preserve}/DigDwarfs.meta" Assets/DigDwarfs.meta
          rm -rf unity

          python - <<'PY'
          from pathlib import Path
          import re

          suffixes = {'.cs','.csproj','.json','.md','.py','.sh','.txt','.yml','.yaml','.props','.targets','.rsp','.asmdef','.asset','.meta','.unity','.sln'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in suffixes and path.name not in {'.gitignore','.editorconfig'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8-sig')
              except (UnicodeDecodeError, OSError):
                  continue
              old = text
              text = text.replace('file:../../../src', 'file:../src')
              text = text.replace('unity/Dig.Unity/', '')
              text = text.replace('unity/Dig.Unity', '.')
              text = re.sub(r'ROOT\s*(?:\n\s*)?/\s*"unity"\s*(?:\n\s*)?/\s*"Dig\.Unity"', 'ROOT', text)
              text = text.replace('UNITY_CSHARP_ROOTS = ("src", "tests", "unity")', 'UNITY_CSHARP_ROOTS = ("src", "tests", "Assets")')
              if text != old:
                  path.write_text(text, encoding='utf-8')

          playmode = Path('.github/workflows/unity-playmode.yml')
          text = playmode.read_text()
          text = text.replace('      - "unity/**"\n', '      - "Assets/**"\n      - "Packages/**"\n      - "ProjectSettings/**"\n')
          playmode.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('unity/\n  Dig.Unity/                     Unity 6 presentation host and editor tooling\n', 'Assets/                            Unity 6 presentation assets and editor tooling\nPackages/                          Unity Package Manager configuration\nProjectSettings/                   Unity project settings\n')
          text = text.replace('Select `.`, not the repository root.', 'Select the repository root.')
          text = text.replace('remove the generated `./Library` directory', 'remove the generated `Library` directory')
          readme.write_text(text)

          doc = Path('docs/implementation/unity-presentation-host.md')
          text = doc.read_text()
          text = text.replace('Select `<repository>/.`, not the repository root.', 'Select the repository root.')
          text = text.replace('`./Packages/manifest.json`', '`Packages/manifest.json`')
          text = text.replace('under `./Assets/Dig.Unity`', 'under `Assets/Dig.Unity`')
          doc.write_text(text)
          PY

          cat > tools/quality/check_single_unity_project.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          ROOT = Path(__file__).resolve().parents[2]
          errors = []
          for name in ('Assets', 'Packages', 'ProjectSettings'):
              if not (ROOT / name).is_dir():
                  errors.append(f'root Unity project is missing {name}/')
          if not (ROOT / 'ProjectSettings' / 'ProjectVersion.txt').is_file():
              errors.append('root Unity project is missing ProjectSettings/ProjectVersion.txt')
          nested = []
          for version_file in ROOT.rglob('ProjectSettings/ProjectVersion.txt'):
              project_root = version_file.parent.parent
              if project_root != ROOT and (project_root / 'Assets').is_dir() and (project_root / 'Packages').is_dir():
                  nested.append(project_root.relative_to(ROOT))
          if nested:
              errors.append('secondary Unity project(s) detected: ' + ', '.join(map(str, sorted(nested))))
          if (ROOT / 'unity' / 'Dig.Unity').exists():
              errors.append('legacy secondary Unity project must not exist')
          if errors:
              print('Unity project layout check failed:', file=sys.stderr)
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          print('PASS: repository root is the only Unity project')
          PY
          chmod +x tools/quality/check_single_unity_project.py

          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/quality.yml')
          text = p.read_text()
          anchor = '      - name: Run architecture, file-size and C# compatibility checks\n        run: python tools/quality/check_quality.py\n'
          if 'check_single_unity_project.py' not in text:
              text = text.replace(anchor, anchor + '\n      - name: Validate single root Unity project layout\n        run: python tools/quality/check_single_unity_project.py\n')
          p.write_text(text)
          PY

          rm -f .github/workflows/unify-unity-project.yml .github/workflows/unify-unity-project-v2.yml
          git add -A

          ! git grep -n 'file:../../../src' -- .
          ! git grep -n 'unity/Dig.Unity' -- .
          test ! -e Assets/Scenes/SampleScene.unity
          test -e Assets/Scenes/Main.unity
          test -d Assets/DigDwarfs
          test ! -e unity/Dig.Unity
          grep -q '"com.bageus.dig.core": "file:../src"' Packages/manifest.json
          grep -q '"version": "file:../src"' Packages/packages-lock.json
          python tools/quality/check_single_unity_project.py
          python -m py_compile tools/quality/*.py
          python tools/quality/check_quality.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: unify Unity project at repository root'
          git push origin HEAD:chore/unify-unity-project
