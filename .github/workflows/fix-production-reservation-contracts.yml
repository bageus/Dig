name: Fix production reservation contracts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fix-production-reservation-contracts.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/complete-building-production-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Apply validated reservation corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pickup = Path('src/Dig.Application/Inventory/WorldItemPickupHandlers.cs')
          text = pickup.read_text()
          old = (
              '        Result completed = jobs.Complete(job.Id, command.Tick);\n'
              '        if (completed.IsFailure)\n'
              '        {\n'
              '            return completed;\n'
              '        }\n\n'
              '        _inventoryRepository.Save(inventory);')
          new = (
              '        Result completed = jobs.Complete(job.Id, command.Tick);\n'
              '        if (completed.IsFailure)\n'
              '        {\n'
              '            return completed;\n'
              '        }\n\n'
              '        inventory.ReleaseReservations(job.Id, command.Tick);\n'
              '        _inventoryRepository.Save(inventory);')
          if text.count(old) != 1:
              raise SystemExit('Expected pickup completion block was not found exactly once.')
          pickup.write_text(text.replace(old, new))

          supply = Path('src/Dig.Domain/Jobs/BuildingSupplyJobDefinition.cs')
          text = supply.read_text()
          old_calls = (
              '        _transitStackIds = NormalizeIds(transitStackIds, nameof(transitStackIds));\n'
              '        _depositStackIds = NormalizeIds(depositStackIds, nameof(depositStackIds));')
          new_calls = (
              '        _transitStackIds = NormalizeIds(\n'
              '            transitStackIds,\n'
              '            nameof(transitStackIds),\n'
              '            allowEmpty: true);\n'
              '        _depositStackIds = NormalizeIds(\n'
              '            depositStackIds,\n'
              '            nameof(depositStackIds),\n'
              '            allowEmpty: false);')
          if text.count(old_calls) != 1:
              raise SystemExit('Expected stack-id normalization calls were not found.')
          text = text.replace(old_calls, new_calls)
          old_signature = (
              '    private static EntityId[] NormalizeIds(\n'
              '        IEnumerable<EntityId> ids,\n'
              '        string parameterName)')
          new_signature = (
              '    private static EntityId[] NormalizeIds(\n'
              '        IEnumerable<EntityId> ids,\n'
              '        string parameterName,\n'
              '        bool allowEmpty)')
          if text.count(old_signature) != 1:
              raise SystemExit('Expected NormalizeIds signature was not found.')
          text = text.replace(old_signature, new_signature)
          old_condition = (
              '        if (values.Length == 0\n'
              '            || values.Any(value => value.IsEmpty)\n'
              '            || values.Distinct().Count() != values.Length)')
          new_condition = (
              '        if ((!allowEmpty && values.Length == 0)\n'
              '            || values.Any(value => value.IsEmpty)\n'
              '            || values.Distinct().Count() != values.Length)')
          if text.count(old_condition) != 1:
              raise SystemExit('Expected NormalizeIds condition was not found.')
          supply.write_text(text.replace(old_condition, new_condition))
          PY
          git rm .github/workflows/fix-production-reservation-contracts.yml
          git diff --check
          python3 tools/quality/check_quality.py
          python3 tools/quality/check_unity_source_contracts.py

      - name: Commit clean corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Dig.Application/Inventory/WorldItemPickupHandlers.cs
          git add src/Dig.Domain/Jobs/BuildingSupplyJobDefinition.cs
          git commit -m 'fix: complete pickup and supply reservation lifecycle'
          git push origin HEAD:${{ github.head_ref }}
