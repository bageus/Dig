name: Apply production output and flat tray correction

on:
  push:
    branches:
      - agent/fix-production-output-and-unit-inventory
    paths:
      - .github/workflows/zz-apply-production-output-flat-trays.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-output-and-unit-inventory
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          cat > /tmp/fix.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/fix.patch.gz.b64 | gzip -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate .NET and source regressions
        shell: bash
        run: dotnet test tests/Dig.Tests/Dig.Tests.csproj -c Release

      - name: Commit correction and remove transport workflow
        shell: bash
        run: |
          rm .github/workflows/zz-apply-production-output-flat-trays.yml
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'Fix production output pickup and flat trays'
          git push origin HEAD:agent/fix-production-output-and-unit-inventory
