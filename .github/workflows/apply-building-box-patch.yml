name: Apply BuildingBox lifecycle patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-building-box-unpack-relocation-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent/building-box-patch.b64 > /tmp/building-box-patch.tgz
          tar -xzf /tmp/building-box-patch.tgz
          rm -f .agent/building-box-patch.b64
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/apply-building-box-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix BuildingBox unpack and relocation lifecycle"
          git push origin HEAD:${{ github.head_ref }}
