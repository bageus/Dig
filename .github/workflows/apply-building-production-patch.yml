name: Apply building production patch

on:
  push:
    branches:
      - feature/building-production-internal-supply

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/agent/prod-patch-00') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/building-production-internal-supply
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/agent/prod-patch-00 \
            .github/agent/prod-patch-A \
            .github/agent/prod-patch-B \
            .github/agent/prod-patch-C \
            .github/agent/prod-patch-D \
            > /tmp/building-production.patch.gz.b64
          base64 --decode /tmp/building-production.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/building-production.patch
          echo "929dac4bb0a6a5e7e50aea90dcb1b4ab90440addae87b2bb8b6f3afeca34a8df  /tmp/building-production.patch" \
            | sha256sum --check
          git apply --check /tmp/building-production.patch
          git apply --index /tmp/building-production.patch
          rm -f \
            .github/agent/prod-patch-00 \
            .github/agent/prod-patch-A \
            .github/agent/prod-patch-B \
            .github/agent/prod-patch-C \
            .github/agent/prod-patch-D \
            .github/workflows/apply-building-production-patch.yml
          rmdir .github/agent 2>/dev/null || true
          git add -A
          git diff --cached --check

      - name: Commit production core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git commit -m "Implement generic building production core"
          git push origin HEAD:feature/building-production-internal-supply
