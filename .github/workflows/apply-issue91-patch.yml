name: Apply issue 91 implementation patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-91-deterministic-deposits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply prepared new-file patch
        shell: bash
        run: |
          if [ ! -f .agent/issue91-newfiles-ready.txt ]; then
            echo "New-file payload is not complete yet."
            exit 0
          fi
          cat .agent/issue91-new.patch.gz.b64.* | base64 --decode | gzip --decompress > /tmp/issue91-new.patch
          git apply --check /tmp/issue91-new.patch
          git apply --index /tmp/issue91-new.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add issue 91 deposit contracts and regressions"
          git push origin HEAD:${{ github.head_ref }}
