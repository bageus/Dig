name: Apply issue 91 implementation patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-91-deterministic-deposits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply prepared patch
        shell: bash
        run: |
          cat .agent/issue91.patch.gz.b64.* | base64 --decode | gzip --decompress > /tmp/issue91.patch
          git apply --check /tmp/issue91.patch
          git apply --index /tmp/issue91.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete deterministic terrain deposits"
          git push origin HEAD:${{ github.head_ref }}
