name: Codex tooltip system index sync

on:
  push:
    branches:
      - codex/fix-central-tooltip-layout-v2

permissions:
  contents: write

jobs:
  sync-system-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/fix-central-tooltip-layout-v2
          fetch-depth: 0

      - name: Update system index
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/systems/README.md")
          text = path.read_text(encoding="utf-8")
          old = "| Runtime building/UI, Health bar, unpack и forced pickup correction | Box Workshop, green platform, building footprint, building title, production tooltip, health bar width, unpack LMB, forced pickup | `APPROVED` | [`runtime-building-ui-health-unpack-pickup-correction-2026-08-04.md`](../design/runtime-building-ui-health-unpack-pickup-correction-2026-08-04.md) | [#634](https://github.com/bageus/Dig/issues/634), [#648](https://github.com/bageus/Dig/issues/648) |"
          new = "| Runtime building/UI, Health bar, unpack и forced pickup correction | Box Workshop, green platform, building footprint, fixed tooltip area, production tooltip, health bar width, unpack LMB, forced pickup | `APPROVED` | [`runtime-building-ui-health-unpack-pickup-correction-2026-08-04.md`](../design/runtime-building-ui-health-unpack-pickup-correction-2026-08-04.md) | [`../implementation/central-tooltip-layout-stability-2026-08-06.md`](../implementation/central-tooltip-layout-stability-2026-08-06.md), [#634](https://github.com/bageus/Dig/issues/634), [#648](https://github.com/bageus/Dig/issues/648), [#658](https://github.com/bageus/Dig/issues/658) |"
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit("Runtime building/UI row was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit synchronized index
        shell: bash
        run: |
          if git diff --quiet -- docs/systems/README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/systems/README.md
          git commit -m "Link fixed tooltip layout in system index"
          git push origin HEAD:codex/fix-central-tooltip-layout-v2
