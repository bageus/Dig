name: Align building side fixtures

on:
  push:
    branches:
      - agent/fix-hud-basket-placement-building-work-position

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-hud-basket-placement-building-work-position
          fetch-depth: 0
      - name: Make side work cells open and reachable in fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          world = Path('tests/Dig.Tests/BuildingBoxPlacementTestWorld.cs')
          text = world.read_text(encoding='utf-8')
          old = '''        HashSet<CellId> open = new HashSet<CellId>(
            definition.ResolveFootprint(origin, orientation));
        foreach (CellId cell in reachable)
'''
          new = '''        CellId[] footprint = definition.ResolveFootprint(origin, orientation).ToArray();
        HashSet<CellId> open = new HashSet<CellId>(footprint);
        open.Add(new CellId(footprint.Min(cell => cell.X) - 1, origin.Y, origin.Z));
        open.Add(new CellId(footprint.Max(cell => cell.X) + 1, origin.Y, origin.Z));
        foreach (CellId cell in reachable)
'''
          if old not in text:
              raise SystemExit('supported world fixture pattern not found')
          world.write_text(text.replace(old, new, 1), encoding='utf-8')

          harness = Path('tests/Dig.Tests/BuildingBoxHarness.cs')
          text = harness.read_text(encoding='utf-8')
          old = 'reachableCells: new[] { new CellId(origin.X, origin.Y - 1) },'
          new = 'reachableCells: new[] { new CellId(origin.X - 1, origin.Y, origin.Z) },'
          if old not in text:
              raise SystemExit('box harness reachable pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '            new CellId(3, 2),\n',
              '            new CellId(3, 2),\n            new CellId(2, 3),\n',
              1)
          text = text.replace(
              '            new CellId(5, 4),\n',
              '            new CellId(5, 4),\n            new CellId(4, 5),\n',
              1)
          harness.write_text(text, encoding='utf-8')

          construction = Path('tests/Dig.Tests/BuildingConstructionHarness.cs')
          text = construction.read_text(encoding='utf-8')
          old = '                new[] { new CellId(3, 2) },'
          new = '                new[] { new CellId(2, 3) },'
          if old not in text:
              raise SystemExit('construction harness reachable pattern not found')
          construction.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/Dig.Tests/BuildingConstructionTests.cs')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '                new[] { new CellId(3, 2) },',
              '                new[] { new CellId(2, 3) },')
          tests.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/align-building-side-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Dig.Tests
          git commit -m "Align building fixtures with side work positions"
          git push origin HEAD:agent/fix-hud-basket-placement-building-work-position
