name: Agent export current main

on:
  push:
    branches:
      - agent/fix-internal-stock-routing-and-production-workflow

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Export current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git archive --format=zip --output=/tmp/dig-main-current.zip origin/main

      - name: Upload current main
        uses: actions/upload-artifact@v4
        with:
          name: agent-main-source
          path: /tmp/dig-main-current.zip
          if-no-files-found: error

      - name: Publish run id and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/agent-main-export-run.txt
          rm .github/workflows/agent-export-main.yml
          git add -A
          git commit -m "Record current main source export"
          git push origin "HEAD:${GITHUB_REF_NAME}"
