name: Diagnose supported action positions

on:
  push:
    branches:
      - agent/fix-production-output-and-unit-inventory
    paths:
      - .github/workflows/zz-diagnose-supported-action-position.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-output-and-unit-inventory
          fetch-depth: 1

      - name: Collect focused selectors and contracts
        shell: bash
        run: |
          set -euo pipefail
          pattern='StartDirectMushroomChopCommand|MushroomChopJobDefinition|StartResidentFoodMeal|ResidentFoodMeal|FoodMealJob|BarrelAttackSurface|HasFullSupport|FullSupport|ShaftGapTraverse|DepthTraverse|VerticalClimb|WorkPosition'
          mapfile -t files < <(grep -RliE "$pattern" src unity tests | sort | head -n 80)
          full=/tmp/supported-action-position-full.txt
          {
            echo '=== AUTHORITATIVE SPECS ==='
            for file in \
              docs/design/mushroom-growth-and-chopping.md \
              docs/design/campfire-cooking-and-food-use.md \
              docs/design/needs-continuous-actions.md \
              docs/design/resident-movement-occupancy-and-vertical-traversal.md \
              docs/design/runtime-stacking-barrel-and-room-recovery-decisions.md; do
              echo "===== $file ====="
              nl -ba "$file"
            done
            echo '=== MATCHED FILES ==='
            printf '%s\n' "${files[@]}"
            echo '=== FOCUSED SOURCE ==='
            for file in "${files[@]}"; do
              echo "===== $file ====="
              nl -ba "$file" | head -n 450 || true
            done
          } > "$full"
          head -n 12000 "$full" > docs/implementation/_supported-action-position-diagnostic.txt
          cat docs/implementation/_supported-action-position-diagnostic.txt

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add docs/implementation/_supported-action-position-diagnostic.txt
          git commit -m 'Capture focused supported action selectors'
          git push origin HEAD:agent/fix-production-output-and-unit-inventory
