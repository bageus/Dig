name: Diagnose supported action positions

on:
  push:
    branches:
      - agent/fix-production-output-and-unit-inventory
    paths:
      - .github/workflows/zz-diagnose-supported-action-position.yml

permissions:
  contents: write

env:
  REPORT: /tmp/supported-action-position-report.txt

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-output-and-unit-inventory
          fetch-depth: 1

      - name: Collect architecture and implementation context
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== SYSTEM INDEX MATCHES ==='
            grep -RniE 'mushroom|food|eat|consume|work position|supported surface|adjacent|approach|interaction position' docs/systems/README.md docs/design docs/implementation || true
            echo
            echo '=== CODE MATCHES ==='
            grep -RniE 'mushroom|eat|consume|work(position|cell)|interaction(position|cell)|supported(cell|surface)|stand(position|cell)|approach(cell|position)|adjacent(cell|position)|neighbor(cell|position)' src unity tests || true
            echo
            echo '=== CANDIDATE FILES ==='
            grep -RliE 'mushroom|eat|consume|work(position|cell)|interaction(position|cell)|supported(cell|surface)|stand(position|cell)|approach(cell|position)|adjacent(cell|position)' src unity tests docs/design docs/implementation | sort || true
          } > "$REPORT"
          head -n 5000 "$REPORT" > docs/implementation/_supported-action-position-diagnostic.txt
          cat docs/implementation/_supported-action-position-diagnostic.txt

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add docs/implementation/_supported-action-position-diagnostic.txt
          git commit -m 'Refresh supported action position diagnostic'
          git push origin HEAD:agent/fix-production-output-and-unit-inventory
