name: Diagnose supported action positions

on:
  push:
    branches:
      - agent/fix-production-output-and-unit-inventory
    paths:
      - .github/workflows/zz-diagnose-supported-action-position.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-output-and-unit-inventory
          fetch-depth: 1

      - name: Collect Unity selectors and runtime movement
        shell: bash
        run: |
          set -euo pipefail
          pattern='StartDirectMushroomChopCommand|StartResidentFoodMeal|Mushroom|FoodMeal|WorkPosition|HasFullSupport|FullSupport|ShaftGapTraverse|DepthTraverse|VerticalClimb|UnsupportedResidentRecovery'
          mapfile -t files < <(grep -RliE "$pattern" unity tests/Dig.Tests | sort)
          full=/tmp/supported-action-position-full.txt
          {
            echo '=== MATCHED UNITY AND TEST FILES ==='
            printf '%s\n' "${files[@]}"
            echo '=== FOCUSED SOURCE ==='
            for file in "${files[@]}"; do
              echo "===== $file ====="
              nl -ba "$file" | head -n 650 || true
            done
          } > "$full"
          head -n 16000 "$full" > docs/implementation/_supported-action-position-diagnostic.txt
          cat docs/implementation/_supported-action-position-diagnostic.txt

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add docs/implementation/_supported-action-position-diagnostic.txt
          git commit -m 'Capture Unity supported action selectors'
          git push origin HEAD:agent/fix-production-output-and-unit-inventory
