name: Apply supported action positions

on:
  push:
    branches:
      - agent/fix-production-output-and-unit-inventory
    paths:
      - tools/zz_apply_supported_action_positions.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-output-and-unit-inventory
          fetch-depth: 1

      - name: Apply correction
        shell: bash
        run: |
          set -euo pipefail
          python tools/zz_apply_supported_action_positions.py
          dotnet restore Dig.sln
          dotnet test Dig.sln -c Release --no-restore
          rm -f tools/zz_apply_supported_action_positions.py
          rm -f .github/workflows/zz-diagnose-supported-action-position.yml
          rm -f docs/implementation/_supported-action-position-diagnostic.txt
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'Require supported work and meal positions'
          git push origin HEAD:agent/fix-production-output-and-unit-inventory
