name: Diagnose supported action positions

on:
  push:
    branches:
      - agent/fix-production-output-and-unit-inventory
    paths:
      - .github/workflows/zz-diagnose-supported-action-position.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-output-and-unit-inventory
          fetch-depth: 1

      - name: Collect food support call sites
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -RniE '_startResidentFoodMeal|new StartResidentFoodMealHandler|StartResidentFoodMealHandler\(' src unity tests || true
          } > docs/implementation/_supported-action-position-diagnostic.txt
          cat docs/implementation/_supported-action-position-diagnostic.txt

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add docs/implementation/_supported-action-position-diagnostic.txt
          git commit -m 'Locate resident food meal support call sites'
          git push origin HEAD:agent/fix-production-output-and-unit-inventory
