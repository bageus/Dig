name: Apply excavation frontier fix

on:
  push:
    branches:
      - fix/excavation-frontier-entry-and-near-quarter
    paths:
      - .github/patches/excavation-frontier-fix.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/excavation-frontier-entry-and-near-quarter
          fetch-depth: 0
      - name: Apply validated excavation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/excavation-frontier-fix-*.b64 \
            | base64 -d \
            | gzip -d > /tmp/excavation-frontier-fix.patch
          echo "c8f6e7045cb368e726865f30da9e9a871e52e1bc298fb0f6b236bb943b4dcd70  /tmp/excavation-frontier-fix.patch" | sha256sum -c -
          git apply --check /tmp/excavation-frontier-fix.patch
          git apply /tmp/excavation-frontier-fix.patch
          python tools/quality/check_quality.py
          python tools/quality/check_unity_source_contracts.py
          git diff --check
          git rm .github/workflows/apply-excavation-frontier-fix.yml
          git rm .github/patches/excavation-frontier-fix-*.b64
          git rm .github/patches/excavation-frontier-fix.ready
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore excavation frontier entry and gravity"
          git push origin HEAD:fix/excavation-frontier-entry-and-near-quarter
