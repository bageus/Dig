name: Apply excavation fix

on:
  push:
    branches:
      - agent/fix-excavation-room-placement

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated patch
        env:
          PATCH_B64: >-
            
            
            
            
            P7sA/jM/aS1rLTk+NxzHLq5Dnu4GCTLR1yQ6puIlrlWGZknt+58BzI4y6L7cAAA=
        run: |
          printf '%s' "$PATCH_B64" | tr -d '[:space:]' | base64 --decode | gzip --decompress > /tmp/dig-fix.patch
          git apply --index /tmp/dig-fix.patch
          git rm .github/workflows/apply-agent-excavation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: excavation continuation and room placement"
          git push origin "HEAD:${GITHUB_REF_NAME}"
